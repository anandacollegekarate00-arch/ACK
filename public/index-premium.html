function AttendanceView({ students, attendance, sessions, onMark, onRemoveMark, onMarkAllAbsent, currentUser }) {
  const [date, setDate] = React.useState(todayISO());
  const dateSessions = React.useMemo(() => sessionsForDate(sessions, date), [sessions, date]);
  const [sessionId, setSessionId] = React.useState(null);
  const [query, setQuery] = React.useState('');
  const [selected, setSelected] = React.useState(null);
  const [notes, setNotes] = React.useState('');
  const [pendingStatus, setPendingStatus] = React.useState(null);
  const [showCodeEntry, setShowCodeEntry] = React.useState(false);
  const [showScanner, setShowScanner] = React.useState(false);
  const [codeInput, setCodeInput] = React.useState('');
  const [codeError, setCodeError] = React.useState('');
  const [scanError, setScanError] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const [confirmRemove, setConfirmRemove] = React.useState(false);
  const [confirmBulkAbsent, setConfirmBulkAbsent] = React.useState(false);
  const [bulkBusy, setBulkBusy] = React.useState(false);

  React.useEffect(() => { setSessionId(dateSessions.length === 1 ? dateSessions[0].id : null); }, [date, sessions]);

  const filtered = students.filter(s => displayName(s).toLowerCase().includes(query.toLowerCase()) || s.admission_id.toLowerCase().includes(query.toLowerCase()));
  const recFor = (studentId) => attendance.find(a => a.student_id === studentId && a.date === date && (a.session_id || null) === (sessionId || null));
  const existingRec = selected ? recFor(selected.id) : null;
  const sessionLabel = sessionId ? (dateSessions.find(s => s.id === sessionId)?.title || 'Session') : 'General (no session picked)';
  const isToday = date === todayISO();
  const unmarked = React.useMemo(() => students.filter(s => !recFor(s.id)), [students, attendance, date, sessionId]);

  async function confirm() {
    if (!selected || !pendingStatus) return;
    setBusy(true);
    try {
      await onMark({ student_id: selected.id, date, session_id: sessionId || null, status: pendingStatus, marked_by: currentUser.id, notes: notes || null });
      setSelected(null); setPendingStatus(null); setNotes('');
    } finally { setBusy(false); }
  }

  async function removeMark() {
    if (!selected || !existingRec) return;
    setBusy(true);
    try {
      await onRemoveMark(existingRec.id);
      setConfirmRemove(false); setSelected(null); setPendingStatus(null); setNotes('');
    } finally { setBusy(false); }
  }

  async function confirmMarkAllAbsent() {
    setBulkBusy(true);
    try {
      await onMarkAllAbsent({ date, session_id: sessionId || null, studentIds: unmarked.map(s => s.id), marked_by: currentUser.id });
      setConfirmBulkAbsent(false);
    } finally { setBulkBusy(false); }
  }

  function lookupByAdmissionId(code) {
    const match = students.find(s => s.admission_id.toLowerCase() === code.trim().toLowerCase());
    return match || null;
  }

  function submitCode() {
    const match = lookupByAdmissionId(codeInput);
    if (!match) { setCodeError('No student found with that admission ID.'); return; }
    setSelected(match); setShowCodeEntry(false); setCodeInput(''); setCodeError('');
  }

  function handleScanned(text) {
    const match = lookupByAdmissionId(text);
    setShowScanner(false);
    if (!match) { setScanError(`Scanned "${text}" but no student has that admission ID.`); return; }
    setScanError('');
    setSelected(match);
  }

  function shiftDate(deltaDays) {
    const d = new Date(date + 'T00:00:00');
    d.setDate(d.getDate() + deltaDays);
    setDate(ymd(d));
  }

  return (
    <div className="p-4 sm:p-6 max-w-2xl lg:max-w-5xl xl:max-w-6xl mx-auto pb-24 sm:pb-6">
      <div className="flex items-center justify-between mb-3">
        <h1 className="text-xl font-extrabold" style={{ color: 'var(--ack-heading)', fontFamily: 'Poppins, sans-serif' }}>Mark Attendance</h1>
        <button onClick={() => downloadCSV(`ack-attendance-${todayISO()}.csv`,
          ['Date', 'Session', 'Admission ID', 'Student', 'Status', 'Notes', 'Marked By'],
          [...attendance].sort((a, b) => (b.date + (b.session_id || '')).localeCompare(a.date + (a.session_id || ''))).map(a => {
            const st = students.find(s => s.id === a.student_id);
            const sn = (sessions.find(s => s.id === a.session_id)?.name) || '';
            return [a.date, sn, st ? st.admission_id : '', st ? displayName(st) : '', a.status, a.notes, a.marked_by];
          }))}
          className="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap" style={{ background: 'var(--ack-surface-2)', color: 'var(--ack-heading)' }}>
          <Download size={13} /> Export CSV
        </button>
      </div>

      <div className="flex items-center gap-2 mb-3">
        <button onClick={() => shiftDate(-1)} className="w-9 h-9 rounded-lg flex items-center justify-center shrink-0" style={{ background: 'var(--ack-surface-2)' }}><ChevronLeft size={16} color="var(--ack-heading)" /></button>
        <input type="date" className={`${inputCls} flex-1`} value={date} max={todayISO()} onChange={e => setDate(e.target.value)} />
        <button onClick={() => shiftDate(1)} disabled={isToday} className="w-9 h-9 rounded-lg flex items-center justify-center shrink-0 disabled:opacity-30" style={{ background: 'var(--ack-surface-2)' }}><ChevronRight size={16} color="var(--ack-heading)" /></button>
      </div>
      {!isToday && <p className="text-[11px] text-[var(--ack-muted)] mb-3">Viewing a past date — you can still add, change, or remove marks here.</p>}

      <DaySummaryBar attendance={attendance} date={date} sessionId={sessionId} totalStudents={students.length} />

      {unmarked.length > 0 && (
        <button onClick={() => setConfirmBulkAbsent(true)} className="w-full mb-3 py-2.5 rounded-xl text-xs font-semibold border flex items-center justify-center gap-1.5" style={{ borderColor: DANGER, color: DANGER }}>
          <AlertTriangle size={14} /> Mark all {unmarked.length} unmarked as absent
        </button>
      )}

      {dateSessions.length > 0 && (
        <div className="flex gap-2 mb-3 overflow-x-auto">
          {dateSessions.map(s => (
            <button key={s.id} onClick={() => setSessionId(s.id)} className="px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap"
              style={sessionId === s.id ? { background: ROYAL, color: '#fff' } : { background: 'var(--ack-surface-2)', color: 'var(--ack-muted)' }}>{s.title} · {s.time}</button>
          ))}
          <button onClick={() => setSessionId(null)} className="px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap"
            style={sessionId === null ? { background: ROYAL, color: '#fff' } : { background: 'var(--ack-surface-2)', color: 'var(--ack-muted)' }}>General</button>
        </div>
      )}
      {dateSessions.length === 0 && (
        <p className="text-[11px] text-[var(--ack-muted)] mb-3">No practice sessions were scheduled that day — attendance is marked generally for the date. Add sessions from the Dashboard.</p>
      )}

      <div className="relative mb-2">
        <Search size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-[var(--ack-muted)]" />
        <input className={`${inputCls} pl-9 pr-36`} placeholder="Search student" value={query} onChange={e => setQuery(e.target.value)} />
        <div className="absolute right-2 top-1/2 -translate-y-1/2 flex gap-1">
          <button onClick={() => setShowScanner(true)} className="flex items-center gap-1 text-[11px] font-semibold px-2 py-1 rounded-lg active:scale-95 transition text-white" style={{ background: ROYAL }}>
            <Camera size={13} /> Scan
          </button>
          <button onClick={() => setShowCodeEntry(true)} className="flex items-center gap-1 text-[11px] font-semibold px-2 py-1 rounded-lg active:scale-95 transition" style={{ background: 'var(--ack-surface-2)', color: ROYAL }}>
            <QrCode size={13} /> Code
          </button>
        </div>
      </div>
      {scanError && <p className="text-xs text-red-600 mb-2">{scanError}</p>}

      {showScanner && <QRScannerModal onDetected={handleScanned} onClose={() => setShowScanner(false)} />}

      {showCodeEntry && (
        <Modal title="Enter Admission ID" onClose={() => { setShowCodeEntry(false); setCodeError(''); }}>
          <p className="text-xs text-[var(--ack-muted)] mb-3">Scan the student's QR ID with any QR scanner app, then paste or type the code it gives you here.</p>
          <Field label="Admission ID"><input className={inputCls} value={codeInput} onChange={e => setCodeInput(e.target.value)} placeholder="e.g. ACK-2026-001" autoCapitalize="characters" /></Field>
          {codeError && <p className="text-xs text-red-600 mb-3">{codeError}</p>}
          <PrimaryButton onClick={submitCode} className="w-full">Find Student</PrimaryButton>
        </Modal>
      )}

      {!selected && (
        <div className="space-y-2 mt-3">
          {filtered.map(s => {
            const rec = recFor(s.id);
            return (
              <button key={s.id} onClick={() => setSelected(s)} className="w-full text-left">
                <Card className="p-3 flex items-center gap-3">
                  <Avatar name={displayName(s)} size={40} />
                  <div className="flex-1 min-w-0">
                    <p className="font-semibold text-sm truncate" style={{ color: 'var(--ack-heading)' }}>{displayName(s)}</p>
                    <p className="text-[11px] text-[var(--ack-muted)]">{s.admission_id}</p>
                  </div>
                  <BeltBadge belt={s.belt} small />
                  {rec && <span className="text-[10px] font-bold uppercase" style={{ color: rec.status === 'present' ? SUCCESS : rec.status === 'late' ? WARNING : DANGER }}>{rec.status}</span>}
                </Card>
              </button>
            );
          })}
          {filtered.length === 0 && <p className="text-sm text-[var(--ack-muted)] py-10 text-center">No students found.</p>}
        </div>
      )}

      {selected && (
        <Card className="p-4 mt-3">
          <button onClick={() => { setSelected(null); setPendingStatus(null); }} className="flex items-center gap-1 text-xs text-[var(--ack-muted)] mb-3"><ArrowLeft size={13} /> Back to search</button>
          <div className="flex items-center gap-3 mb-4">
            <Avatar name={displayName(selected)} size={52} />
            <div>
              <p className="font-bold text-sm" style={{ color: 'var(--ack-heading)' }}>{displayName(selected)}</p>
              <p className="text-[11px] text-[var(--ack-muted)]">{selected.admission_id}</p>
              <BeltBadge belt={selected.belt} small />
            </div>
          </div>
          <div className="text-xs text-[var(--ack-muted)] mb-3 bg-[var(--ack-surface-2)] rounded-xl p-3 space-y-1">
            <p>Session: <span className="font-semibold text-[var(--ack-text)]">{sessionLabel} · {date}</span></p>
            <p>Marked by: <span className="font-semibold text-[var(--ack-text)]">{currentUser.name || currentUser.email}</span></p>
            {existingRec && <p>Currently marked: <span className="font-semibold" style={{ color: existingRec.status === 'present' ? SUCCESS : existingRec.status === 'late' ? WARNING : DANGER }}>{existingRec.status}</span></p>}
          </div>
          <div className="grid grid-cols-3 gap-2 mb-3">
            <button onClick={() => setPendingStatus('present')} className="py-3 rounded-xl flex flex-col items-center gap-1 font-semibold text-xs" style={pendingStatus === 'present' ? { background: SUCCESS, color: '#fff' } : { background: `${SUCCESS}14`, color: SUCCESS }}><Check size={18} />Present</button>
            <button onClick={() => setPendingStatus('absent')} className="py-3 rounded-xl flex flex-col items-center gap-1 font-semibold text-xs" style={pendingStatus === 'absent' ? { background: DANGER, color: '#fff' } : { background: `${DANGER}14`, color: DANGER }}><X size={18} />Absent</button>
            <button onClick={() => setPendingStatus('late')} className="py-3 rounded-xl flex flex-col items-center gap-1 font-semibold text-xs" style={pendingStatus === 'late' ? { background: WARNING, color: '#fff' } : { background: `${WARNING}14`, color: WARNING }}><Clock size={18} />Late</button>
          </div>
          <Field label="Notes (optional)"><textarea rows={2} className={inputCls} value={notes} onChange={e => setNotes(e.target.value)} /></Field>
          <PrimaryButton onClick={confirm} disabled={!pendingStatus || busy} className="w-full mb-2">{busy ? 'Saving…' : 'Confirm Attendance'}</PrimaryButton>
          {existingRec && (
            <button onClick={() => setConfirmRemove(true)} disabled={busy} className="w-full py-2.5 rounded-xl text-xs font-semibold border flex items-center justify-center gap-1.5" style={{ borderColor: DANGER, color: DANGER }}>
              <Trash2 size={14} /> Remove this mark
            </button>
          )}
        </Card>
      )}

      {confirmRemove && (
        <ConfirmDialog title="Remove this attendance mark?"
          message={`This clears ${selected ? displayName(selected) : ''}'s "${existingRec?.status}" mark for ${date} entirely — it'll show as not marked, not just changed. This cannot be undone.`}
          confirmLabel="Remove" onCancel={() => setConfirmRemove(false)} onConfirm={removeMark} />
      )}
      {confirmBulkAbsent && (
        <ConfirmDialog title="Mark all unmarked students absent?"
          message={`This marks ${unmarked.length} student${unmarked.length === 1 ? '' : 's'} with no record yet for ${sessionLabel} on ${date} as absent. Anyone already marked present or late is left untouched.`}
          confirmLabel={bulkBusy ? 'Marking…' : 'Mark Absent'} onCancel={() => setConfirmBulkAbsent(false)} onConfirm={confirmMarkAllAbsent} />
      )}
    </div>
  );
}

function ManageSessionsModal({ sessions, onAdd, onDelete, onClose }) {
  const [title, setTitle] = React.useState('');
  const [time, setTime] = React.useState('06:30');
  const [days, setDays] = React.useState([]);
  const [confirmDeleteId, setConfirmDeleteId] = React.useState(null);

  function toggleDay(d) { setDays(prev => prev.includes(d) ? prev.filter(x => x !== d) : [...prev, d].sort()); }
  async function submit() {
    if (!title || days.length === 0) return;
    await onAdd({ title, time, days });
    setTitle(''); setDays([]);
  }
  const toDelete = sessions.find(s => s.id === confirmDeleteId);

  return (
    <Modal title="Manage Practice Sessions" onClose={onClose} wide>
      <p className="text-xs text-[var(--ack-muted)] mb-3">Add a recurring practice session and pick which days it runs.</p>
      <Field label="Session name"><input className={inputCls} value={title} onChange={e => setTitle(e.target.value)} placeholder="e.g. Morning Practice" /></Field>
      <Field label="Time"><input type="time" className={inputCls} value={time} onChange={e => setTime(e.target.value)} /></Field>
      <Field label="Repeats on">
        <div className="flex gap-1.5 flex-wrap">
          {WEEKDAY_LABELS.map((d, i) => (
            <button key={i} type="button" onClick={() => toggleDay(i)} className="w-9 h-9 rounded-full text-[11px] font-bold transition"
              style={days.includes(i) ? { background: ROYAL, color: '#fff' } : { background: 'var(--ack-surface-2)', color: 'var(--ack-muted)' }}>{d[0]}</button>
          ))}
        </div>
      </Field>
      <PrimaryButton onClick={submit} className="w-full mb-4">Add session</PrimaryButton>
      <div className="space-y-2">
        {sessions.map(s => (
          <div key={s.id} className="flex items-center justify-between bg-[var(--ack-surface-2)] rounded-xl p-3">
            <div>
              <p className="text-sm font-semibold" style={{ color: 'var(--ack-heading)' }}>{s.title}</p>
              <p className="text-[11px] text-[var(--ack-muted)]">{s.time} · {s.days.map(d => WEEKDAY_LABELS[d]).join(', ')}</p>
            </div>
            <button onClick={() => setConfirmDeleteId(s.id)} className="p-2 rounded-lg" style={{ color: DANGER }}><Trash2 size={15} /></button>
          </div>
        ))}
        {sessions.length === 0 && <p className="text-xs text-[var(--ack-muted)] text-center py-4">No practice sessions added yet.</p>}
      </div>
      {toDelete && (
        <ConfirmDialog title="Remove this session?" message={`"${toDelete.title}" (${toDelete.time}) will no longer appear on the Dashboard.`}
          onCancel={() => setConfirmDeleteId(null)} onConfirm={async () => { await onDelete(toDelete.id); setConfirmDeleteId(null); }} />
      )}
    </Modal>
  );
}

function TournamentFormModal({ series, existing, onClose, onSave, onCreateSeries }) {
  const [useNewSeries, setUseNewSeries] = React.useState(!existing && series.length === 0);
  const [seriesId, setSeriesId] = React.useState(existing?.series_id || '');
  const [newSeriesName, setNewSeriesName] = React.useState('');
  const [level, setLevel] = React.useState(existing?.level || 'School');
  const [name, setName] = React.useState(existing?.name || '');
  const [date, setDate] = React.useState(existing?.date || todayISO());
  const [location, setLocation] = React.useState(existing?.location || '');
  const [saving, setSaving] = React.useState(false);
  const [error, setError] = React.useState('');

  function applySeriesDefaults(sId, dateVal) {
    const s = series.find(x => x.id === sId);
    if (s && !existing) {
      setLevel(s.level);
      const year = (dateVal || date || todayISO()).slice(0, 4);
      setName(`${s.name} ${year}`);
    }
  }

  async function submit() {
    setError('');
    let finalSeriesId = seriesId || null;
    setSaving(true);
    try {
      if (useNewSeries) {
        if (!newSeriesName.trim()) { setError('Give the series a name (e.g. "Senior School Championship").'); setSaving(false); return; }
        const created = await onCreateSeries({ name: newSeriesName.trim(), level });
        finalSeriesId = created?.id || null;
      }
      if (!name.trim()) { setError('Give this tournament a name.'); setSaving(false); return; }
      const saved = await onSave({
        ...(existing ? { id: existing.id } : {}),
        name: name.trim(), level, date: date || null, location: location || null,
        series_id: finalSeriesId,
      });
      onClose();
      return saved;
    } catch (e) {
      setError(e.message || 'Something went wrong.');
    } finally { setSaving(false); }
  }

  return (
    <Modal title={existing ? 'Edit Tournament' : 'New Tournament'} onClose={onClose} wide>
      <p className="text-xs text-[var(--ack-muted)] mb-3">Link this to a series (e.g. "Senior School Championship") so results across years — '26, '27, '28 — can be compared automatically.</p>
      <Field label="Series">
        {!useNewSeries ? (
          <select className={inputCls} value={seriesId} onChange={e => { setSeriesId(e.target.value); applySeriesDefaults(e.target.value, date); }}>
            <option value="">— One-off tournament (no series) —</option>
            {series.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
        ) : (
          <input className={inputCls} value={newSeriesName} onChange={e => setNewSeriesName(e.target.value)} placeholder="e.g. Senior School Championship" />
        )}
        <button type="button" onClick={() => { setUseNewSeries(v => !v); setSeriesId(''); }} className="text-xs font-semibold mt-1.5" style={{ color: ROYAL }}>
          {useNewSeries ? '← Choose an existing series instead' : '+ Start a new series'}
        </button>
      </Field>
      <Field label="Tournament name"><input className={inputCls} value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Senior School Championship 2026" /></Field>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <Field label="Level">
          <select className={inputCls} value={level} onChange={e => setLevel(e.target.value)}>
            {LEVELS.map(l => <option key={l} value={l}>{l}</option>)}
          </select>
        </Field>
        <Field label="Date"><input type="date" className={inputCls} value={date} onChange={e => { setDate(e.target.value); applySeriesDefaults(seriesId, e.target.value); }} /></Field>
      </div>
      <Field label="Location (optional)"><input className={inputCls} value={location} onChange={e => setLocation(e.target.value)} /></Field>
      {error && <p className="text-xs text-red-600 mb-3">{error}</p>}
      <PrimaryButton onClick={submit} disabled={saving} className="w-full">{saving ? 'Saving…' : existing ? 'Save Changes' : 'Create Tournament'}</PrimaryButton>
    </Modal>
  );
}

function TournamentEventFormModal({ onClose, onSave }) {
  const [category, setCategory] = React.useState('individual');
  const [preset, setPreset] = React.useState(EVENT_PRESETS.individual[0]);
  const [teamSize, setTeamSize] = React.useState(3);
  const [dates, setDates] = React.useState([todayISO()]);
  const [saving, setSaving] = React.useState(false);

  React.useEffect(() => { setPreset(EVENT_PRESETS[category][0]); }, [category]);

  function setDateAt(i, v) { setDates(ds => ds.map((d, idx) => idx === i ? v : d)); }
  function addDate() { setDates(ds => [...ds, '']); }
  function removeDate(i) { setDates(ds => ds.filter((_, idx) => idx !== i)); }

  async function submit() {
    setSaving(true);
    try {
      await onSave({ name: preset, category, team_size: category === 'team' ? Number(teamSize) || 3 : null, dates: dates.filter(Boolean) });
      onClose();
    } finally { setSaving(false); }
  }

  return (
    <Modal title="Add Event" onClose={onClose}>
      <Field label="Type">
        <div className="flex gap-2">
          {['individual', 'team'].map(c => (
            <button key={c} type="button" onClick={() => setCategory(c)} className="flex-1 py-2 rounded-xl text-xs font-semibold capitalize border"
              style={category === c ? { background: ROYAL, color: '#fff', borderColor: ROYAL } : { borderColor: 'var(--ack-border)', color: 'var(--ack-muted)' }}>{c}</button>
          ))}
        </div>
      </Field>
      <Field label="Event">
        <select className={inputCls} value={preset} onChange={e => setPreset(e.target.value)}>
          {EVENT_PRESETS[category].map(p => <option key={p} value={p}>{p}</option>)}
        </select>
      </Field>
      {category === 'team' && <Field label="Team size"><input type="number" min="2" className={inputCls} value={teamSize} onChange={e => setTeamSize(e.target.value)} /></Field>}
      <Field label="Event date(s)">
        <div className="space-y-2">
          {dates.map((d, i) => (
            <div key={i} className="flex gap-2">
              <input type="date" className={`${inputCls} flex-1`} value={d} onChange={e => setDateAt(i, e.target.value)} />
              {dates.length > 1 && (
                <button type="button" onClick={() => removeDate(i)} className="w-9 h-9 rounded-xl flex items-center justify-center shrink-0" style={{ background: `${DANGER}14` }}><X size={14} color={DANGER} /></button>
              )}
            </div>
          ))}
          <button type="button" onClick={addDate} className="text-xs font-semibold" style={{ color: ROYAL }}>+ Add another day</button>
        </div>
      </Field>
      <PrimaryButton onClick={submit} disabled={saving} className="w-full">{saving ? 'Adding…' : 'Add Event'}</PrimaryButton>
    </Modal>
  );
}

function EventRosterCard({ event, students, registrations, achievements, tournament, onRegister, onUnregister, onSaveResult, onDeleteAchievement, onDeleteEvent, openStudent }) {
  const [addingStudentId, setAddingStudentId] = React.useState('');
  const [resultStudent, setResultStudent] = React.useState(null);
  const [confirmDeleteEvent, setConfirmDeleteEvent] = React.useState(false);

  const roster = rosterForEvent(event.id, registrations, students);
  const registeredIds = new Set(roster.map(r => r.student.id));
  const available = students.filter(s => !registeredIds.has(s.id));
  const eventResults = achievements.filter(a => a.event_id === event.id);
  function findResult(studentId) { return eventResults.find(a => a.student_id === studentId); }
  const full = event.category === 'team' && event.team_size && roster.length >= event.team_size;

  async function addPlayer() { if (!addingStudentId) return; await onRegister({ event_id: event.id, student_id: addingStudentId }); setAddingStudentId(''); }

  return (

      <div className="flex items-start justify-between mb-2">

          const result = findResult(student.id);
          return (
            <div key={registration.id} className="flex items-center gap-2 bg-[var(--ack-surface-2)] rounded-xl p-2.5">

const DAILY_RANGE_OPTIONS = [
  { id: 7, label: '7D' },
  { id: 14, label: '14D' },
  { id: 30, label: '30D' },
];

function AnalyticsView({ students, attendance, sessions, achievements, tournamentEvents, eventRegistrations, openStudent }) {
  const years = React.useMemo(() => attendanceYears(attendance), [attendance]);
  const [year, setYear] = React.useState('all');
  const [sessionId, setSessionId] = React.useState('all');
  const [dailyRange, setDailyRange] = React.useState(14);
  const [period, setPeriod] = React.useState('day');
  const [anchorDate, setAnchorDate] = React.useState(todayISO());
  const [playerMetric, setPlayerMetric] = React.useState('medals');

  // Year + session filtered slice — drives the daily/monthly trend charts
  // and the per-student needs-attention / top-performer lists.
  const scoped = React.useMemo(() => attendance.filter(a =>
    (year === 'all' || a.date.startsWith(year)) &&
    (sessionId === 'all' || (a.session_id || null) === sessionId)
  ), [attendance, year, sessionId]);

  // Only the session filter applies here — "all years" is the whole point
  // of this chart, so the year dropdown shouldn't collapse it to one bar.
  const sessionScoped = React.useMemo(() => attendance.filter(a =>
    sessionId === 'all' || (a.session_id || null) === sessionId
  ), [attendance, sessionId]);

  // Independent Day/Week/Month/Year/All picker for the breakdown pie chart
  // and the stat row above it — separate from the year filter above so you
  // can look at, say, just today's breakdown without losing the trend
  // charts' year context.
  const periodScoped = React.useMemo(() => {
    const range = period === 'all' ? null : periodRange(period, anchorDate);
    return attendance.filter(a =>
      (sessionId === 'all' || (a.session_id || null) === sessionId) &&
      (!range || (a.date >= range.start && a.date <= range.end))
    );
  }, [attendance, sessionId, period, anchorDate]);

  const breakdown = React.useMemo(() => attendanceBreakdown(periodScoped), [periodScoped]);
  const daily = React.useMemo(() => dailyRateSeries(scoped, dailyRange), [scoped, dailyRange]);
  const monthly = React.useMemo(() => (
    year === 'all' ? monthlyRateSeriesRolling(scoped) : monthlyRateSeriesForYear(scoped, year)
  ), [scoped, year]);
  const yearly = React.useMemo(() => yearlyRateSeries(sessionScoped), [sessionScoped]);

  // Top Players — ranked by real data only: medals won (Gold first, then
  // Silver, then Bronze), attendance rate in the current filter, or number of
  // events entered. No synthetic scores, no weights.
  const topPlayers = React.useMemo(() => {
    const rows = students.map(s => {
      const my = achievements.filter(a => a.student_id === s.id);
      const medals = {
        Gold: my.filter(a => a.placement === 'Gold').length,
        Silver: my.filter(a => a.placement === 'Silver').length,
        Bronze: my.filter(a => a.placement === 'Bronze').length,
      };
      const att = attendanceBreakdown(scoped.filter(a => a.student_id === s.id));
      const entries = eventRegistrations.filter(r => r.student_id === s.id).length;
      return { student: s, medals, medalsTotal: medals.Gold + medals.Silver + medals.Bronze, att, entries };
    });
    const sorters = {
      medals: (a, b) => b.medals.Gold - a.medals.Gold || b.medals.Silver - a.medals.Silver || b.medals.Bronze - a.medals.Bronze || b.medalsTotal - a.medalsTotal,
      attendance: (a, b) => b.att.rate - a.att.rate || b.att.total - a.att.total,
      participation: (a, b) => b.entries - a.entries || b.medalsTotal - a.medalsTotal,
    };
    return rows
      .filter(r => playerMetric !== 'attendance' || r.att.total > 0)
      .sort(sorters[playerMetric])
      .slice(0, 10);
  }, [students, scoped, achievements, eventRegistrations, playerMetric]);

  // Needs Attention flags long absence streaks (2+ weeks since last seen),
  // not just a low attendance percentage — deliberately ignores the year
  // filter (only the session filter) since "how long has it been" is a
  // question about right now, not about whichever year happens to be picked.
  const needsAttention = React.useMemo(() => {
    const today = todayISO();
    return students
      .map(s => ({ student: s, status: studentAbsenceStatus(sessionScoped, s.id, today) }))
      .filter(r => r.status && r.status.days > ABSENCE_ALERT_DAYS)
      .sort((a, b) => b.status.days - a.status.days)
      .slice(0, 6);
  }, [students, sessionScoped]);

  const selectCls = "text-xs font-semibold rounded-full px-3 py-1.5 border border-[var(--ack-border)] bg-[var(--ack-card)] shrink-0";

  return (

// Notifications are derived client-side (latest achievements + the most
// recent session's absentees) — there's no table for them, so "unread" is
// tracked with a last-seen timestamp: anything dated after that counts as
// unread on the bell badge, and visiting the screen marks everything seen.
function computeNotifications(students, attendance, achievements) {
  const items = [];
  function studentName(id) { return displayName(students.find(s => s.id === id)) || 'A student'; }
  [...achievements].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 8).forEach(a => {
    items.push({ id: `ach-${a.id}`, type: 'Achievement', icon: Trophy, tint: GOLD, text: `${studentName(a.student_id)} logged ${a.title}${a.placement ? ' — ' + a.placement : ''}`, date: a.date });
  });
  const recentDate = attendance.length ? [...attendance].sort((a, b) => b.date.localeCompare(a.date))[0].date : null;
  if (recentDate) {
    attendance.filter(a => a.date === recentDate && a.status === 'absent').forEach(a => {
      items.push({ id: `abs-${a.id}`, type: 'Attendance', icon: Bell, tint: DANGER, text: `${studentName(a.student_id)} was absent on ${a.date}`, date: a.date });
    });
  }
  items.sort((a, b) => b.date.localeCompare(a.date));
  return items;
}

function NotificationsView({ students, attendance, achievements }) {
  const [filter, setFilter] = React.useState('All');

  React.useEffect(() => {
    // Visiting the screen marks everything as seen (including items that
    // arrive while it's open — the next render picks them up as read).
    localStorage.setItem('ack-notifications-seen', String(Date.now()));
  }, []);

  const items = computeNotifications(students, attendance, achievements);
  const filtered = filter === 'All' ? items : items.filter(i => i.type === filter);

  return (
    <div className="p-4 sm:p-6 max-w-2xl lg:max-w-5xl xl:max-w-6xl mx-auto pb-24 sm:pb-6">
      <h1 className="text-xl font-extrabold mb-4" style={{ color: 'var(--ack-heading)', fontFamily: 'Poppins, sans-serif' }}>Notifications</h1>

            style={filter === f ? { background: 'var(--ack-heading)', color: '#fff' } : { background: 'var(--ack-surface-2)', color: 'var(--ack-muted)' }}>{f}</button>
        ))}
      </div>
      <div className="space-y-2">
        {filtered.map(n => (
          <Card key={n.id} className="p-3.5 flex items-start gap-3">
            <div className="w-9 h-9 rounded-xl flex items-center justify-center shrink-0" style={{ background: `${n.tint}1A` }}><n.icon size={16} color={n.tint} /></div>

function EditProfileModal({ profile, onClose, onSave }) {
  const [name, setName] = React.useState(profile.name || '');
  const [position, setPosition] = React.useState(profile.position || '');
  const [phone, setPhone] = React.useState(profile.phone || '');
  const [photo, setPhoto] = React.useState(profile.avatar_url || '');
  const [error, setError] = React.useState('');

  function handleFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) { setError('Please choose an image file.'); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const size = 240;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const scale = Math.max(size / img.width, size / img.height);
        const w = img.width * scale, h = img.height * scale;
        ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
        setPhoto(canvas.toDataURL('image/jpeg', 0.85));
        setError('');
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  async function submit() {
    if (!name.trim()) { setError('Name is required.'); return; }
    await onSave({ name: name.trim(), position, phone, avatar_url: photo });
  }

  return (
    <Modal title="Edit Profile" onClose={onClose}>
      <div className="flex flex-col items-center mb-4">
        <div className="relative">
          <Avatar name={name || profile.name} photo={photo} size={84} />
          <label className="absolute -bottom-1 -right-1 w-8 h-8 rounded-full flex items-center justify-center shadow cursor-pointer" style={{ background: ROYAL }}>
            <Edit3 size={14} color="#fff" />
            <input type="file" accept="image/*" className="hidden" onChange={handleFile} />
          </label>
        </div>
        <p className="text-[11px] text-[var(--ack-muted)] mt-2">Tap the icon to change your photo</p>
      </div>
      <Field label="Full name"><input className={inputCls} value={name} onChange={e => setName(e.target.value)} /></Field>
      <Field label="Position / title"><input className={inputCls} value={position} onChange={e => setPosition(e.target.value)} placeholder="e.g. Head Coach, Assistant Coach, Captain" /></Field>
      <Field label="Phone"><input className={inputCls} value={phone} onChange={e => setPhone(e.target.value)} /></Field>
      {error && <p className="text-xs text-red-600 mb-3">{error}</p>}
      <PrimaryButton onClick={submit} className="w-full">Save Profile</PrimaryButton>
    </Modal>
  );
}

function ChangePasswordModal({ supabaseClient, onClose, required }) {
  const [newPw, setNewPw] = React.useState('');
  const [confirmPw, setConfirmPw] = React.useState('');
  const [error, setError] = React.useState('');
  const [done, setDone] = React.useState(false);

  async function submit() {
    if (newPw.length < 6) { setError('Password must be at least 6 characters.'); return; }
    if (newPw !== confirmPw) { setError("Passwords don't match."); return; }
    const { error: err } = await supabaseClient.auth.updateUser({ password: newPw });
    if (err) { setError(err.message); return; }
    // Clear the forced-change flag so this isn't asked again next sign-in.
    const { data: sess } = await supabaseClient.auth.getSession();
    if (sess?.session?.user?.user_metadata?.must_change_password) {
      await supabaseClient.auth.updateUser({ data: { must_change_password: false } });
    }
    setDone(true);
  }

  return (
    <Modal title={required ? 'Set a New Password' : 'Change Password'} onClose={onClose} required={required}>
      {done ? (
        <p className="text-sm text-[var(--ack-text)]">Password updated. {required ? 'You can now continue.' : ''}</p>
      ) : (
        <>
          {required && <p className="text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-xl p-3 mb-3">For your security, the one-time password issued by your coach must be replaced with one you choose. This is required before you can continue.</p>}
          <Field label="New password"><input type="password" className={inputCls} value={newPw} onChange={e => setNewPw(e.target.value)} /></Field>
          <Field label="Confirm new password"><input type="password" className={inputCls} value={confirmPw} onChange={e => setConfirmPw(e.target.value)} /></Field>
          {error && <p className="text-xs text-red-600 mb-3">{error}</p>}
          <PrimaryButton onClick={submit} className="w-full">Update Password</PrimaryButton>
        </>
      )}
    </Modal>
  );
}

function CreateParentLoginModal({ student, onClose, onCreate }) {
  const [busy, setBusy] = React.useState(false);
  const [error, setError] = React.useState('');
  const [done, setDone] = React.useState(false);
  const [generatedPassword, setGeneratedPassword] = React.useState('');
  const phone = student.guardian_whatsapp || '';
  const digits = phone.replace(/\D/g, '');

  async function submit() {
    if (!digits) { setError("Add a WhatsApp number for this student first, via Edit → Guardian Information."); return; }
    setBusy(true); setError('');
    try {
      // onCreate returns the one-time password the DB generated for the parent
      const pwd = await onCreate({ phone, studentId: student.id, name: `${displayName(student)}'s guardian` });
      setGeneratedPassword(pwd || '');
      setDone(true);
    } catch (e) {
      setError(e.message || 'Could not create that login.');
    } finally { setBusy(false); }
  }

  return (
    <Modal title="Create Parent Login" onClose={onClose}>
      {done ? (
        <div>
          <p className="text-sm text-[var(--ack-text)] mb-2">Login created. Share these with the parent:</p>
          <div className="bg-[var(--ack-surface-2)] rounded-xl p-3 text-xs space-y-1 mb-3">
            <p>Login ID (WhatsApp number): <span className="font-bold">{phone}</span></p>
            <p>One-time password: <span className="font-bold">{generatedPassword || '—'}</span></p>
          </div>
          <p className="text-xs text-[var(--ack-muted)]">This password is random and shown only once. The parent must change it on first sign-in — the app will ask them automatically. You can generate a new one from the Parent Logins panel anytime.</p>
        </div>
      ) : (
        <>
          <p className="text-xs text-[var(--ack-muted)] mb-3">Creates a read-only login for {displayName(student)}'s parent, using their WhatsApp number as the login ID. A random one-time password is generated and shown once — the parent must change it after their first sign-in.</p>

            <p className="text-[var(--ack-muted)]">WhatsApp number on file</p>

          <PrimaryButton onClick={submit} disabled={busy} className="w-full">{busy ? 'Creating…' : 'Create Login'}</PrimaryButton>
        </>
      )}
    </Modal>
  );
}

function ResetParentPasswordDialog({ parentProfile, onClose, onReset }) {

  const [done, setDone] = React.useState(false);
  const [newPassword, setNewPassword] = React.useState('');

  return (

          </div>
        ))}
        {parentProfiles.length === 0 && <p className="text-xs text-[var(--ack-muted)] text-center py-4">No parent logins created yet.</p>}
      </div>
      {resetTarget && <ResetParentPasswordDialog parentProfile={resetTarget} onClose={() => setResetTarget(null)} onReset={onResetPassword} />}
    </Modal>
  );
}

function ProfileView({ profile, user, students, profiles, onSignOut, onUpdateProfile, onCreateParentAccount, onResetParentPassword, darkMode, onToggleDarkMode, push, supabaseClient }) {
  const [notifOn, setNotifOn] = React.useState(true);
  const [showPwModal, setShowPwModal] = React.useState(false);
  const [showEditModal, setShowEditModal] = React.useState(false);
  const [showParentPanel, setShowParentPanel] = React.useState(false);

  return (
    <div className="p-4 sm:p-6 max-w-2xl lg:max-w-5xl xl:max-w-6xl mx-auto pb-24 sm:pb-6">
      <h1 className="text-xl font-extrabold mb-4" style={{ color: 'var(--ack-heading)', fontFamily: 'Poppins, sans-serif' }}>My Profile</h1>
      <Card className="p-5 mb-4 flex flex-col items-center text-center relative">
        <button onClick={() => setShowEditModal(true)} className="absolute top-4 right-4 flex items-center gap-1 text-xs font-semibold px-2.5 py-1.5 rounded-full" style={{ background: `${ROYAL}14`, color: ROYAL }}>
          <Edit3 size={12} /> Edit
        </button>
        <Avatar name={profile.name || user.email} photo={profile.avatar_url} size={72} />
        <p className="font-extrabold text-base mt-3" style={{ color: 'var(--ack-heading)', fontFamily: 'Poppins, sans-serif' }}>{profile.name || user.email}</p>
        <p className="text-xs text-[var(--ack-muted)]">{profile.position || (profile.role === 'captain' ? 'Club Captain' : 'Coach')}</p>
        <div className="flex flex-wrap justify-center gap-x-4 gap-y-1 mt-3 text-xs text-[var(--ack-muted)]">
          <span className="flex items-center gap-1 break-all"><Mail size={12} />{user.email}</span>
          {profile.phone && <span className="flex items-center gap-1"><Phone size={12} />{profile.phone}</span>}
        </div>
        <span className="mt-3 text-[11px] font-bold px-3 py-1 rounded-full" style={{ background: `${ROYAL}1A`, color: ROYAL }}>{profile.role === 'captain' ? 'Captain' : 'Coach'}</span>
      </Card>

      <Card className="divide-y divide-[var(--ack-border)] mb-4">
        <div className="flex items-center justify-between px-4 py-3.5">
          <span className="flex items-center gap-2 text-sm text-[var(--ack-text)]"><Moon size={16} color="var(--ack-heading)" />Dark Mode</span>
          <button onClick={onToggleDarkMode} className="w-11 h-6 rounded-full relative transition" style={{ background: darkMode ? ROYAL : '#E5E7EB' }}>
            <span className="absolute top-0.5 w-5 h-5 rounded-full bg-white transition-all" style={{ left: darkMode ? 22 : 2 }} />
          </button>
        </div>
        <div className="flex items-center justify-between px-4 py-3.5">
          <button onClick={() => push('notifications')} className="flex items-center gap-2 text-sm text-[var(--ack-text)]"><Bell size={16} color="var(--ack-heading)" />Notifications</button>
          <button onClick={() => setNotifOn(v => !v)} className="w-11 h-6 rounded-full relative transition" style={{ background: notifOn ? ROYAL : (darkMode ? 'var(--ack-border)' : '#E5E7EB') }}>
            <span className="absolute top-0.5 w-5 h-5 rounded-full bg-white transition-all" style={{ left: notifOn ? 22 : 2 }} />
          </button>
        </div>
        <button onClick={() => setShowPwModal(true)} className="w-full flex items-center gap-2 px-4 py-3.5 text-sm text-[var(--ack-text)]"><KeyRound size={16} color="var(--ack-heading)" />Account Security</button>
        <button onClick={() => setShowParentPanel(true)} className="w-full flex items-center gap-2 px-4 py-3.5 text-sm text-[var(--ack-text)]"><Users size={16} color="var(--ack-heading)" />Parent Logins</button>
      </Card>

      <button onClick={onSignOut} className="w-full py-3 rounded-xl font-semibold text-sm border flex items-center justify-center gap-2" style={{ borderColor: DANGER, color: DANGER }}>
        <LogOut size={16} /> Logout
      </button>

      {showPwModal && <ChangePasswordModal supabaseClient={supabaseClient} onClose={() => setShowPwModal(false)} />}
      {showEditModal && <EditProfileModal profile={profile} onClose={() => setShowEditModal(false)} onSave={async (patch) => { await onUpdateProfile(patch); setShowEditModal(false); }} />}
      {showParentPanel && <ParentAccountsPanel students={students} profiles={profiles} onCreate={onCreateParentAccount} onResetPassword={onResetParentPassword} onClose={() => setShowParentPanel(false)} />}
    </div>
  );
}

function ParentView({ profile, students, attendance, achievements, tournaments, tournamentSeries, tournamentEvents, eventRegistrations, onSignOut }) {
  const student = students.find(s => s.id === profile.student_id);
  return (
    <div className="min-h-dvh bg-[var(--ack-bg)]">
      <div className="flex items-center justify-between gap-3 px-4 py-3 sticky top-0 z-30"
        style={{ background: 'linear-gradient(135deg,#0B2A5B,#1F5EFF 60%,#7C3AED)', backgroundSize: '200% 200%', animation: 'ackBgDrift 12s ease infinite', boxShadow: '0 8px 28px rgba(11,31,58,.3)' }}>
        <div className="flex items-center gap-2 min-w-0">
          <Shield size={18} color={GOLD} className="shrink-0" />
          <span className="text-white font-bold text-sm truncate">Welcome, {profile.name}</span>
        </div>
        <button onClick={onSignOut} className="shrink-0"><LogOut size={18} color="#fff" /></button>
      </div>
      {student ? (
        <StudentProfilePage student={student} attendance={attendance} achievements={achievements}
          tournaments={tournaments} tournamentSeries={tournamentSeries} tournamentEvents={tournamentEvents} eventRegistrations={eventRegistrations} readOnly />
      ) : (
        <p className="p-6 text-sm text-gray-400">No student is linked to this account. Please contact a coach.</p>
      )}
    </div>
  );
}

      <div className="absolute top-10 right-0 text-[220px] font-bold select-none pointer-events-none leading-none" style={{ color: 'rgba(255,255,255,0.05)', fontFamily: 'serif' }}>道</div>

function LoginScreen({ onSignIn }) {
  const [role, setRole] = React.useState('coach');
  const [email, setEmail] = React.useState('');
  const [password, setPassword] = React.useState('');
  const [showPw, setShowPw] = React.useState(false);
  const [error, setError] = React.useState('');
  const [busy, setBusy] = React.useState(false);

  async function submit(e) {
    e.preventDefault();
    setError('');
    setBusy(true);
    const loginEmail = role === 'parent' ? phoneToParentEmail(email) : email.trim();
    const err = await onSignIn(loginEmail, password);
    setBusy(false);
    if (err) setError(err.message || 'Could not sign in — check your details and password.');
  }

  return (
    <div className="min-h-dvh flex flex-col relative overflow-hidden"
      style={{ background: 'linear-gradient(135deg,#0B2A5B 0%,#1F5EFF 45%,#7C3AED 100%)', backgroundSize: '220% 220%', animation: 'ackBgDrift 14s ease infinite' }}>
      <div className="ack-blob" style={{ width: 360, height: 360, top: -90, right: -70, background: 'rgba(56,189,248,.45)' }} />
      <div className="ack-blob" style={{ width: 300, height: 300, bottom: -80, left: -60, background: 'rgba(139,92,246,.5)', animationDelay: '-6s' }} />
      <div className="ack-blob" style={{ width: 220, height: 220, top: '30%', left: '55%', background: 'rgba(34,211,238,.35)', animationDelay: '-12s' }} />
      <div className="relative flex-1 flex flex-col items-center justify-center px-6 py-10">
        <div className="relative w-full max-w-sm" style={{ animation: 'iosScreenIn .5s cubic-bezier(.22,1,.36,1) both' }}>
          <div className="flex flex-col items-center mb-7">
            <div className="w-20 h-20 rounded-[26px] flex items-center justify-center mb-4 float-anim"
              style={{ background: 'rgba(255,255,255,.16)', backdropFilter: 'blur(16px)', WebkitBackdropFilter: 'blur(16px)', border: '1px solid rgba(255,255,255,.35)', boxShadow: '0 20px 50px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.4)' }}>
              <Shield size={34} color={GOLD} />
            </div>
            <h1 className="text-white font-extrabold text-2xl text-center tracking-tight" style={{ fontFamily: 'Poppins, sans-serif', textShadow: '0 4px 24px rgba(0,0,0,.25)' }}>Ananda College<br />Karate</h1>
            <p className="text-white/60 text-xs mt-1.5 tracking-[0.25em]">DISCIPLINE · FOCUS · EXCELLENCE</p>
          </div>

          <Card className="p-5 !bg-white/10 border-white/25" style={{ backdropFilter: 'blur(30px) saturate(1.6)', WebkitBackdropFilter: 'blur(30px) saturate(1.6)', boxShadow: '0 32px 80px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.3)' }}>
            <div className="grid grid-cols-2 gap-2 mb-4 p-1 rounded-xl" style={{ background: 'rgba(255,255,255,.12)', border: '1px solid rgba(255,255,255,.2)' }}>
              {[{ id: 'coach', label: 'Coach / Captain' }, { id: 'parent', label: 'Parent' }].map(r => (
                <button key={r.id} type="button" onClick={() => setRole(r.id)} className="py-2 rounded-lg text-xs font-semibold transition"
                  style={role === r.id ? { background: 'linear-gradient(135deg,#38BDF8,#6366F1)', color: '#fff', boxShadow: '0 6px 18px rgba(56,189,248,.4)' } : { color: 'rgba(255,255,255,.7)' }}>{r.label}</button>
              ))}
            </div>

            <form onSubmit={submit}>
              <Field label={role === 'parent' ? 'WhatsApp Number' : 'Email'}>
                <input type={role === 'parent' ? 'tel' : 'email'} value={email} onChange={e => setEmail(e.target.value)}
                  autoCapitalize="none" required placeholder={role === 'parent' ? '+94 7X XXX XXXX' : 'coach@example.com'}
                  className="w-full border border-white/25 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-300/40 focus:border-cyan-200 bg-white/10 text-white placeholder-white/40"
                  style={{ boxShadow: 'inset 0 2px 8px rgba(0,0,0,.15)' }} />
              </Field>
              <Field label="Password">
                <div className="relative">
                  <input type={showPw ? 'text' : 'password'} value={password} onChange={e => setPassword(e.target.value)} required
                    placeholder="••••••••"
                    className="w-full border border-white/25 rounded-xl px-3.5 py-2.5 pr-9 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-300/40 focus:border-cyan-200 bg-white/10 text-white placeholder-white/40"
                    style={{ boxShadow: 'inset 0 2px 8px rgba(0,0,0,.15)' }} />
                  <button type="button" onClick={() => setShowPw(v => !v)} className="absolute right-3 top-1/2 -translate-y-1/2 text-white/60">
                    {showPw ? <EyeOff size={16} /> : <Eye size={16} />}
                  </button>
                </div>
              </Field>
              {error && <p className="text-xs text-red-300 mb-3 bg-red-500/15 border border-red-400/30 rounded-lg px-2.5 py-1.5">{error}</p>}
              <button type="submit" disabled={busy} className="relative overflow-hidden w-full py-3 rounded-xl font-semibold text-sm text-white transition disabled:opacity-60"
                style={{ background: 'linear-gradient(135deg,#38BDF8,#6366F1)', backgroundSize: '200% 200%', animation: 'ackBgDrift 5s ease infinite', boxShadow: '0 12px 32px rgba(56,189,248,.45)' }}>
                {busy ? 'Signing in…' : 'Log in'}
                <span className="ack-shimmer" />
              </button>
            </form>
          </Card>

          <div className="mt-4 bg-white/10 border border-white/20 backdrop-blur-xl rounded-xl p-3 flex gap-2">
            <AlertTriangle size={16} className="text-amber-300 shrink-0 mt-0.5" />
            <p className="text-[11px] text-white/80 leading-snug">
              Coaches and captains: your account is created directly in the Supabase dashboard. Parents: your login is created for you by a coach after registration.
            </p>
          </div>

          <p className="text-center text-white/50 text-[11px] mt-5">Ananda College Karate · Strength in Spirit, Excellence in Action</p>
        </div>
      </div>
    </div>
  );
}
function createSupabaseClients(url, anonKey) {
  const client = window.supabase.createClient(url, anonKey);
  const secondary = window.supabase.createClient(url, anonKey, {
    auth: { storageKey: 'akc-secondary-auth', persistSession: false, autoRefreshToken: false },
  });
  return { client, secondary };
}

// Baked-in production connection — every visitor gets this automatically,
// no setup screen and no per-device configuration. (A setup/switch-your-
// project screen was removed: a single club runs against a single project,
// and the localStorage override path was a footgun that silently pointed
// the app at the wrong database on someone else's device.)
const DEFAULT_SUPABASE_URL = 'https://velrrklvyefnpvrkidww.supabase.co';
const DEFAULT_SUPABASE_KEY = 'sb_publishable_YHyncslQiCaJk7wXcrk01Q_iFXZCozu';

function AppRoot() {
  const [clients, setClients] = React.useState(null);

  React.useEffect(() => {
    // Always the club's own project — no storage overrides, no gate.
    try { setClients(createSupabaseClients(DEFAULT_SUPABASE_URL, DEFAULT_SUPABASE_KEY)); }
    catch (e) { setClients(null); }
  }, []);

  if (!clients) return <SplashScreen />;
  return <App supabaseClient={clients.client} supabaseSecondaryClient={clients.secondary} />;
}

function App({ supabaseClient, supabaseSecondaryClient }) {
  const { session, profile, profileError, loading: authLoading, signIn, signOut, refreshProfile } = useAuth(supabaseClient);
  const isLoggedIn = !!session;
  const data = useClubData(supabaseClient, supabaseSecondaryClient, isLoggedIn);

  const [tab, setTab] = React.useState('dashboard');
  const [stack, setStack] = React.useState([]);
  const [pendingAction, setPendingAction] = React.useState({});
  const [darkMode, setDarkMode] = React.useState(() => localStorage.getItem('akc-dark-mode') === '1');
  const toggleDarkMode = React.useCallback(() => {
    setDarkMode(prev => { const next = !prev; localStorage.setItem('akc-dark-mode', next ? '1' : '0'); return next; });
  }, []);

  const goToTab = React.useCallback((nextTab, action) => { setStack([]); setTab(nextTab); if (action) setPendingAction(action); }, []);
  const push = React.useCallback((screen) => setStack(prev => [...prev, screen]), []);
  const goBack = React.useCallback(() => setStack(prev => prev.slice(0, -1)), []);
  const openStudent = React.useCallback((id) => push(`student:${id}`), [push]);
  const openTournament = React.useCallback((id) => push(`tournament:${id}`), [push]);
  const openSeries = React.useCallback((id) => push(`series:${id}`), [push]);

  // Forced password change: parents created via the coach flow sign in with a
  // random one-time password and a must_change_password flag; block the app
  // until they pick their own password.
  const [forcePwChange, setForcePwChange] = React.useState(false);
  React.useEffect(() => {
    const flagged = !!(isLoggedIn && profile?.role === 'parent' && session?.user?.user_metadata?.must_change_password);
    if (flagged !== forcePwChange) setForcePwChange(flagged);
  }, [isLoggedIn, profile, session, forcePwChange]);

  // Real unread badge: notifications dated after the last visit to the
  // Notifications screen. Parents get a minimal inbox (their own kid), so
  // this badge is computed the same way for them on their own data.
  const notifications = React.useMemo(
    () => isLoggedIn ? computeNotifications(data.students, data.attendance, data.achievements) : [],
    [isLoggedIn, data.students, data.attendance, data.achievements]
  );
  const unreadCount = React.useMemo(() => {
    const seen = Number(localStorage.getItem('ack-notifications-seen') || 0);
    return notifications.filter(n => {
      const t = new Date(n.date + 'T00:00:00').getTime();
      return t > seen;
    }).length;
  }, [notifications]);

  if (authLoading || (isLoggedIn && data.loading)) return <SplashScreen />;
  if (!isLoggedIn) return <LoginScreen onSignIn={signIn} />;
  if (!profile) {
    return (
      <div className="min-h-dvh flex flex-col items-center justify-center gap-3 p-6 text-center relative overflow-hidden"
        style={{ background: 'linear-gradient(135deg,#0B2A5B 0%,#1F5EFF 45%,#7C3AED 100%)', backgroundSize: '220% 220%', animation: 'ackBgDrift 14s ease infinite' }}>
        <p className="text-white font-semibold">No profile found for this account.</p>
        <p className="text-gray-400 text-sm max-w-sm">Check that a row exists for this user in the `profiles` table with a `role` set (coach, captain, or parent).</p>
        {profileError && (
          <div className="mt-2 bg-black/30 rounded-lg p-3 max-w-sm text-left">
            <p className="text-red-300 text-xs font-mono break-words">
              {profileError.message ? `message: ${profileError.message}` : ''}
              {profileError.code ? `\ncode: ${profileError.code}` : ''}
              {profileError.details ? `\ndetails: ${profileError.details}` : ''}
              {profileError.hint ? `\nhint: ${profileError.hint}` : ''}
            </p>
          </div>
        )}
        <button onClick={signOut} className="mt-2 text-sm underline text-gray-300">Sign out</button>
      </div>
    );
  }

  if (profile.role === 'parent') {
    return (
      <div className={darkMode ? 'ack-dark' : ''}>
        <ParentView profile={profile} students={data.students} attendance={data.attendance} achievements={data.achievements}
          tournaments={data.tournaments} tournamentSeries={data.tournamentSeries} tournamentEvents={data.tournamentEvents} eventRegistrations={data.eventRegistrations} onSignOut={signOut} />
        {forcePwChange && <ChangePasswordModal supabaseClient={supabaseClient} required onClose={() => setForcePwChange(false)} />}
      </div>
    );
  }

  const top = stack[stack.length - 1] || null;
  let content, headerTitle;

  if (top === 'notifications') {
    content = <NotificationsView students={data.students} attendance={data.attendance} achievements={data.achievements} />;
    headerTitle = 'Notifications';
  } else if (top === 'manageSessions') {
    content = <div className="p-4 sm:p-6 max-w-2xl mx-auto"><ManageSessionsModal sessions={data.sessions} onAdd={data.addSession} onDelete={data.deleteSession} onClose={goBack} /></div>;
    headerTitle = 'Practice Sessions';
  } else if (top && top.startsWith('student:')) {
    const student = data.students.find(s => s.id === top.slice(8));
    content = student
      ? <StudentProfilePage student={student} attendance={data.attendance} achievements={data.achievements} tournaments={data.tournaments} tournamentSeries={data.tournamentSeries} tournamentEvents={data.tournamentEvents} eventRegistrations={data.eventRegistrations} profiles={data.profiles} onUpdate={data.updateStudent} onDelete={data.deleteStudent} onAddAchievement={data.addAchievement} onCreateParentAccount={data.createParentAccountByPhone} onResetParentPassword={data.resetParentPassword} openTournament={openTournament} />
      : <p className="p-6 text-sm text-gray-400">Student not found.</p>;
    headerTitle = student ? displayName(student) : 'Student Profile';
  } else if (top && top.startsWith('tournament:')) {
    const tournament = data.tournaments.find(t => t.id === top.slice(11));
    content = tournament
      ? <TournamentDetailPage tournament={tournament} thisSeries={data.tournamentSeries.find(s => s.id === tournament.series_id)} allSeries={data.tournamentSeries}
          students={data.students} events={data.tournamentEvents} registrations={data.eventRegistrations} achievements={data.achievements}
          onAddEvent={data.addEvent} onDeleteEvent={data.deleteEvent} onRegister={data.registerForEvent} onUnregister={data.unregisterFromEvent}
          onSaveResult={(a) => a.id ? data.updateAchievement(a) : data.addAchievement(a)} onDeleteAchievement={data.deleteAchievement}
          onSaveTournament={data.updateTournament} onDeleteTournament={async (id) => { await data.deleteTournament(id); goBack(); }}
          onCreateSeries={data.addSeries} openStudent={openStudent} openSeries={openSeries} />
      : <p className="p-6 text-sm text-gray-400">Tournament not found.</p>;
    headerTitle = tournament ? tournament.name : 'Tournament';
  } else if (top && top.startsWith('series:')) {
    const series = data.tournamentSeries.find(s => s.id === top.slice(7));
    content = series
      ? <SeriesDetailPage series={series} tournaments={data.tournaments} events={data.tournamentEvents} registrations={data.eventRegistrations} achievements={data.achievements} openTournament={openTournament} />
      : <p className="p-6 text-sm text-gray-400">Series not found.</p>;
    headerTitle = series ? series.name : 'Series';
  } else if (tab === 'dashboard') {
    content = <Dashboard profile={profile} students={data.students} attendance={data.attendance} achievements={data.achievements} sessions={data.sessions} goToTab={goToTab} push={push} />;
    headerTitle = 'Ananda College Karate';
  } else if (tab === 'students') {
    content = <StudentsView students={data.students} attendance={data.attendance} onAddStudent={data.addStudent} openStudent={openStudent} autoOpenAdd={!!pendingAction.addStudent} onConsumeAutoOpen={() => setPendingAction({})} onImportStudents={data.addStudentsBatch} />;
    headerTitle = 'Students';
  } else if (tab === 'attendance') {
    content = <AttendanceView students={data.students} attendance={data.attendance} sessions={data.sessions} onMark={data.markAttendance} onRemoveMark={data.deleteAttendance} onMarkAllAbsent={data.markAllAbsent} currentUser={{ ...session.user, name: profile.name }} />;
    headerTitle = 'Attendance';
  } else if (tab === 'achievements') {
    content = <AchievementsView tournaments={data.tournaments} tournamentSeries={data.tournamentSeries} achievements={data.achievements}
      onAddTournament={data.addTournament} onCreateSeries={data.addSeries}
      autoOpenAdd={!!pendingAction.newTournament} onConsumeAutoOpen={() => setPendingAction({})}
      openTournament={openTournament} openSeries={openSeries} />;
    headerTitle = 'Tournaments';
  } else if (tab === 'analytics') {
    content = <AnalyticsView students={data.students} attendance={data.attendance} sessions={data.sessions} achievements={data.achievements} tournamentEvents={data.tournamentEvents} eventRegistrations={data.eventRegistrations} openStudent={openStudent} />;
    headerTitle = 'Analytics';
  } else if (tab === 'profile') {
    content = (
      <ProfileView profile={profile} user={session.user} students={data.students} profiles={data.profiles} supabaseClient={supabaseClient}
        onSignOut={signOut}
        onUpdateProfile={async (patch) => { await data.updateOwnProfile(session.user.id, patch); await refreshProfile(); }}
        onCreateParentAccount={data.createParentAccount}
        onResetParentPassword={data.resetParentPassword}
        darkMode={darkMode} onToggleDarkMode={toggleDarkMode} push={push} />
    );
    headerTitle = 'My Profile';
  }

  const screenKey = top || tab;

  return (
    <div className={`min-h-dvh bg-[var(--ack-bg)] sm:flex ${darkMode ? 'ack-dark' : ''}`}>
      <BottomNav tab={tab} setTab={goToTab} />
      <div className="flex-1 min-w-0">
        <GlassHeader title={headerTitle} avatarName={profile.name || session.user.email} avatarPhoto={profile.avatar_url}
          onBack={stack.length > 0 ? goBack : undefined}
          onAvatarClick={stack.length === 0 ? () => goToTab('profile') : undefined}
          onBellClick={stack.length === 0 ? () => push('notifications') : undefined} unread={unreadCount} />
        <div key={screenKey} className="ios-screen-in">{content}</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AppRoot />);

</script>
