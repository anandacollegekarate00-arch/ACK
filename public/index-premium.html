<script>
  window.__ackErrors = [];
  function ackDescribeError(reason) {
    if (!reason) return 'unknown error';
    if (reason.stack) return reason.stack;
    if (typeof reason === 'object') {
      // Supabase/Postgrest errors are plain objects shaped like
      // { message, details, hint, code } — not real Error instances,
      // so they have no .stack. Pull out the useful fields directly
      // instead of falling back to the useless "[object Object]".
      var parts = [];
      if (reason.message) parts.push('message: ' + reason.message);
      if (reason.details) parts.push('details: ' + reason.details);
      if (reason.hint) parts.push('hint: ' + reason.hint);
      if (reason.code) parts.push('code: ' + reason.code);
      if (parts.length) return parts.join('\n');
      try { return JSON.stringify(reason, null, 2); } catch (e) { return String(reason); }
    }
    return String(reason);
  }
  function ackShowError(msg) {
    window.__ackErrors.push(String(msg));
    var el = document.getElementById('ack-error-banner');
    if (!el) {
      el = document.createElement('div');
      el.id = 'ack-error-banner';
      el.style.cssText = 'position:fixed;inset:0;background:#1a0000;color:#fff;padding:16px;' +
        'font-family:monospace;font-size:12px;overflow:auto;z-index:999999;white-space:pre-wrap;';
      (document.body || document.documentElement).appendChild(el);
    }
    el.textContent = 'Something broke while loading the app:\n\n' + window.__ackErrors.join('\n\n---\n\n');
  }
  window.addEventListener('error', function (e) {
    ackShowError((e.error && e.error.stack) || e.message || String(e));
  });
  window.addEventListener('unhandledrejection', function (e) {
    ackShowError('Unhandled promise rejection: ' + ackDescribeError(e.reason));
  });
</script>

// Stacked composition chart for the Dashboard trend card: present → late →
// absent stack up to 100% of the marks each period, with the headline
// weighted rate (late = half credit) overlaid as a white line with dots.
// Periods with no records collapse to the baseline and read as gaps.
// Pure SVG, no charting library.
function TrendCompositionChart({ data, height = 185 }) {
  const withData = data.filter(p => p.total > 0);
  if (withData.length === 0) {
    return <p className="text-xs text-[var(--ack-muted)] text-center py-8">No attendance records in this range yet — marks appear here as you log them.</p>;
  }
  const w = Math.max(300, data.length * 64);
  const h = height;
  const padTop = 14, padBottom = 30, padX = 10;
  const gridVals = [0, 25, 50, 75, 100];
  const toY = v => h - padBottom - (Math.max(0, Math.min(100, v)) / 100) * (h - padTop - padBottom);
  const bw = (w - padX * 2) / data.length;
  const xFor = i => padX + i * bw + bw / 2;
  const baseY = toY(0);

  function layerPath(lo, hi) {
    let d = '';
    data.forEach((p, i) => {
      const yLo = p.total > 0 ? toY(lo(p)) : baseY;
      const yHi = p.total > 0 ? toY(hi(p)) : baseY;
      d += `${i === 0 ? 'M' : 'L'} ${xFor(i)} ${yLo} `;
    });
    for (let i = data.length - 1; i >= 0; i--) {
      const p = data[i];
      d += `L ${xFor(i)} ${p.total > 0 ? toY(hi(p)) : baseY} `;
    }
    return d + 'Z';
  }

  // The rate line is drawn per contiguous run so gaps stay truly empty.
  const runs = [];
  let curRun = null;
  data.forEach((p, i) => {
    if (p.total > 0) {
      if (!curRun) { curRun = []; runs.push(curRun); }
      curRun.push({ x: xFor(i), y: toY(p.rate), label: p.rate });
    } else {
      curRun = null;
    }
  });

  return (
    <div className="overflow-x-auto">
      <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
        {gridVals.map(v => (
          <g key={v}>
            <line x1={padX} x2={w - padX} y1={toY(v)} y2={toY(v)} style={{ stroke: 'var(--ack-border)' }} strokeWidth="1" />
            <text x={padX - 3} y={toY(v) + 3} fontSize="8" fill="#9CA3AF" textAnchor="end">{v}%</text>
          </g>
        ))}
        <path d={layerPath(p => 0, p => p.present)} fill={SUCCESS} opacity="0.8" />
        <path d={layerPath(p => p.present, p => p.present + p.late)} fill={WARNING} opacity="0.88" />
        <path d={layerPath(p => p.present + p.late, p => p.present + p.late + p.absent)} fill={DANGER} opacity="0.8" />
        {runs.map((run, ri) => (
          <g key={ri}>
            <polyline points={run.map(p => `${p.x},${p.y}`).join(' ')} fill="none" stroke="#fff" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round" opacity="0.9" />
            <polyline points={run.map(p => `${p.x},${p.y}`).join(' ')} fill="none" stroke={ROYAL} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" />
          </g>
        ))}
        {runs.flatMap(run => run).map((p, i) => (
          <circle key={i} cx={p.x} cy={p.y} r="3" fill="#fff" stroke={ROYAL} strokeWidth="1.5" />
        ))}
        {data.map((p, i) => (
          <text key={i} x={xFor(i)} y={h - 10} fontSize="9" fill="#9CA3AF" textAnchor="middle">{p.label}</text>
        ))}
      </svg>
    </div>
  );
}

function MiniBarChart({ data, labelKey, valueKey, color }) {
  const w = 300, h = 140, pad = 24;
  if (!data || data.length === 0) return <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} />;
  const bw = (w - pad * 2) / data.length;
  const toY = (v) => h - pad - (Math.max(0, Math.min(100, v)) / 100) * (h - pad * 2);
  return (
    <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
      {[0, 25, 50, 75, 100].map(v => <line key={v} x1={pad} x2={w - pad} y1={toY(v)} y2={toY(v)} style={{ stroke: 'var(--ack-border)' }} strokeWidth="1" />)}
      {data.map((d, i) => {
        const barH = (h - pad * 2) - (toY(d[valueKey]) - pad);
        return <rect key={i} x={pad + i * bw + bw * 0.2} y={toY(d[valueKey])} width={bw * 0.6} height={Math.max(0, barH)} rx="3" fill={color} />;
      })}
      {data.map((d, i) => (
        <text key={i} x={pad + i * bw + bw / 2} y={h - 4} fontSize="8" fill="#9CA3AF" textAnchor="middle">{d[labelKey]}</text>
      ))}
    </svg>
  );
}

// Donut chart for the Analytics screen's present/late/absent breakdown.
// Self-contained SVG (no charting library) to match MiniAreaChart/MiniBarChart.
function DonutChart({ segments, size = 168, thickness = 22, centerLabel, centerSub }) {
  const total = segments.reduce((s, x) => s + x.value, 0);
  const r = (size - thickness) / 2;
  const cx = size / 2, cy = size / 2;
  const circumference = 2 * Math.PI * r;
  let acc = 0;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="shrink-0">
      <circle cx={cx} cy={cy} r={r} fill="none" style={{ stroke: 'var(--ack-border)' }} strokeWidth={thickness} />
      {total > 0 && segments.filter(s => s.value > 0).map((s, i) => {
        const dash = (s.value / total) * circumference;
        const el = (
          <circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={s.color} strokeWidth={thickness}
            strokeDasharray={`${dash} ${circumference - dash}`} strokeDashoffset={-acc}
            transform={`rotate(-90 ${cx} ${cy})`} strokeLinecap="butt" />
        );
        acc += dash;
        return el;
      })}
      <text x={cx} y={cy - 2} textAnchor="middle" fontSize="22" fontWeight="800" style={{ fill: 'var(--ack-heading)', fontFamily: 'Poppins, sans-serif' }}>{centerLabel}</text>

// Wide trend bar chart shared by the daily / monthly / yearly attendance
// views on the Analytics screen. Scrolls horizontally once bars no longer
// comfortably fit — keeps 30 daily bars or a decade of yearly bars readable
// on a phone screen instead of squashing them unreadably thin. Once there
// are more than a handful of categories the x-axis labels tilt 40° (the
// standard fix for date-heavy bar charts) instead of colliding into each
// other; below that count they stay flat and centered, which reads cleaner
// for a small number of bars.
function TrendBarChart({ data, valueKey = 'rate', labelKey = 'label', color = ROYAL, height = 190, barMinWidth = 30, suffix = '%', maxValue = 100 }) {
  if (!data || data.length === 0) return <p className="text-xs text-[var(--ack-muted)] text-center py-10">No data for this range yet.</p>;
  const rotate = data.length > 8;
  const w = Math.max(300, data.length * barMinWidth);
  const h = height;
  const padTop = 22, padBottom = rotate ? 52 : 26, padX = 16;
  const max = Math.max(1, maxValue);
  const toY = v => h - padBottom - (Math.max(0, Math.min(max, v)) / max) * (h - padTop - padBottom);
  const bw = (w - padX * 2) / data.length;
  const axisY = h - padBottom;
  return (
    <div className="overflow-x-auto">
      <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
        {[0, 0.25, 0.5, 0.75, 1].map(f => <line key={f} x1={padX} x2={w - padX} y1={toY(f * max)} y2={toY(f * max)} style={{ stroke: 'var(--ack-border)' }} strokeWidth="1" />)}
        <line x1={padX} x2={w - padX} y1={axisY} y2={axisY} stroke="#E5E9F2" strokeWidth="1" />
        {data.map((d, i) => {
          const noData = !d.total;
          const x = padX + i * bw + bw * 0.22;
          const bw2 = bw * 0.56;
          const labelX = x + bw2 / 2;
          const barH = axisY - padTop - (toY(d[valueKey]) - padTop);
          return (
            <g key={i}>
              <rect x={x} y={noData ? axisY - 1 : toY(d[valueKey])} width={bw2} height={noData ? 1 : Math.max(1, barH)} rx="4" fill={color} opacity={noData ? 0.15 : 1} />
              {!noData && <text x={labelX} y={toY(d[valueKey]) - 5} fontSize="9" fill="#9CA3AF" textAnchor="middle">{d[valueKey]}{suffix}</text>}
              {rotate ? (
                <text x={labelX} y={axisY + 14} fontSize="9" fill="#9CA3AF" textAnchor="end" transform={`rotate(-40 ${labelX} ${axisY + 14})`}>{d[labelKey]}</text>
              ) : (
                <text x={labelX} y={axisY + 16} fontSize="9" fill="#9CA3AF" textAnchor="middle">{d[labelKey]}</text>
              )}
            </g>
          );
        })}
      </svg>
    </div>
  );
}

/**
 * Opens the device camera, continuously scans frames for a QR code, and
 * calls onDetected(text) the moment one is found. Falls back gracefully
 * (calls onError) if the camera can't be accessed — no camera on the
 * device, permission denied, or not served over HTTPS (getUserMedia
 * requires a secure context, which Vercel/Netlify give you by default).
 */
function QRScannerModal({ onDetected, onClose }) {
  const videoRef = React.useRef(null);
  const canvasRef = React.useRef(null);
  const streamRef = React.useRef(null);
  const rafRef = React.useRef(null);
  const [error, setError] = React.useState('');

  React.useEffect(() => {
    let cancelled = false;

    async function start() {
      if (!navigator.mediaDevices?.getUserMedia) {
        setError('This browser doesn\u2019t support camera access. Use "Enter code" instead.');
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        if (cancelled) { stream.getTracks().forEach(t => t.stop()); return; }
        streamRef.current = stream;
        if (videoRef.current) {
          videoRef.current.srcObject = stream;
          await videoRef.current.play();
          tick();
        }
      } catch (e) {
        setError('Couldn\u2019t access the camera (permission denied, or none available). Use "Enter code" instead.');
      }
    }

    function tick() {
      const video = videoRef.current;
      const canvas = canvasRef.current;
      if (video && canvas && video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);
        if (code && code.data) {
          onDetected(code.data);
          return; // stop the scan loop — parent unmounts this modal
        }
      }
      rafRef.current = requestAnimationFrame(tick);
    }

    start();
    return () => {
      cancelled = true;
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
    };
  }, [onDetected]);

  return (
    <div className="fixed inset-0 z-50 bg-black flex flex-col">
      <div className="flex items-center justify-between p-4">
        <span className="text-white font-semibold text-sm">Scan Student QR ID</span>
        <button onClick={onClose} className="text-white p-2 active:scale-90 transition"><X size={20} /></button>
      </div>
      <div className="flex-1 relative overflow-hidden flex items-center justify-center">
        <video ref={videoRef} className="w-full h-full object-cover" muted playsInline />
        {!error && (
          <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div className="w-56 h-56 border-4 border-white/80 rounded-2xl" />
          </div>
        )}
        {error && (
          <div className="absolute inset-0 flex flex-col items-center justify-center gap-3 px-8 text-center bg-black/80">
            <CameraOff size={32} className="text-white/60" />
            <p className="text-white text-sm">{error}</p>
          </div>
        )}
      </div>
      <canvas ref={canvasRef} className="hidden" />
    </div>
  );
}

function rosterForEvent(eventId, registrations, students) {

// Medal summary for one tournament instance — powers the Tournament
// Analytics card on the tournament detail page.
function tournamentAnalytics(tournamentId, events, registrations, achievements) {
  const evs = events.filter(e => e.tournament_id === tournamentId);
  const results = achievements.filter(a => a.tournament_id === tournamentId);
  const registeredIds = new Set(registrations.filter(r => evs.some(e => e.id === r.event_id)).map(r => r.student_id));
  const medals = { Gold: 0, Silver: 0, Bronze: 0 };
  results.forEach(a => { if (medals[a.placement] !== undefined) medals[a.placement]++; });
  const byEvent = evs.map(e => {
    const evResults = results.filter(a => a.event_id === e.id);
    const evMedals = { Gold: 0, Silver: 0, Bronze: 0 };
    evResults.forEach(a => { if (evMedals[a.placement] !== undefined) evMedals[a.placement]++; });
    return {
      event: e,
      registered: registrations.filter(r => r.event_id === e.id).length,
      results: evResults.length,
      medals: evMedals,
    };
  });
  return { events: evs.length, participants: registeredIds.size, results: results.length, medals, byEvent };
}

// Formats a Date using its LOCAL calendar fields (no UTC conversion) —
// unlike `d.toISOString().slice(0,10)`, which silently rolls the date back
// a day for any timezone ahead of UTC (e.g. Sri Lanka, UTC+5:30). Every
// place in this app that needs "today" or does date-shifting arithmetic
// should go through this, not toISOString.
function ymd(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

// "Today" in the club's own timezone (Asia/Colombo, UTC+5:30, no DST).
// Using the device clock breaks on phones whose timezone is set to something
// else — the app would mark attendance for the wrong date. Part of the
// (year, month, day) is formatted from a formatter forced to Asia/Colombo;
// there's no offset math involved, so DST quirks can't corrupt the date.
const ACK_TZ = 'Asia/Colombo';
const ackDateParts = (d) => {
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone: ACK_TZ, year: 'numeric', month: '2-digit', day: '2-digit',
  }).formatToParts(d);
  const get = (t) => parts.find(p => p.type === t)?.value || '';
  return { y: get('year'), m: get('month'), day: get('day') };
};

function todayISO() {
  const p = ackDateParts(new Date());
  return `${p.y}-${p.m}-${p.day}`;
}

// Turns a WhatsApp/phone number into a synthetic email address so it can be
// used as a Supabase Auth login ID — Supabase requires an email-shaped
// identifier even though the parent only ever sees/uses the phone number.
function phoneToParentEmail(phone) {
  const digits = (phone || '').replace(/\D/g, '');
  return digits ? `${digits}@parent.anandakarateclub.local` : '';
}

function initials(name = '') {
  return name.split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
}

// Client-side preview of the next admission ID. The real ID is assigned by
// the database trigger (see database-schema.sql: assign_admission_id) so two
// coaches can't ever claim the same number; this only shows the coach a
// reasonable preview before the row is saved.
function generateAdmissionId(roster, joinDateISO) {
  const year = (joinDateISO || todayISO()).slice(0, 4);
  const countThisYear = roster.filter(s => s.admission_id?.includes(`ACK-${year}-`)).length;
  return `ACK-${year}-${String(countThisYear + 1).padStart(3, '0')}`;
}

// "Name" (short) is the account/display identifier used everywhere in the
// app; "Full name" is legal-detail info shown only on the profile. Falls
// back to full_name for any student added before this field existed.
function displayName(student) {
  return (student && (student.name || student.full_name)) || 'Unnamed';
}

function statsFor(studentId, attendance) {
  const recs = attendance.filter(a => a.student_id === studentId);
  const total = recs.length;
  const present = recs.filter(r => r.status === 'present').length;
  const absent = recs.filter(r => r.status === 'absent').length;
  const late = recs.filter(r => r.status === 'late').length;
  // "Late" counts as half credit toward the headline attendance rate — the
  // common club convention. presentOnlyPct is kept for anyone who wants the
  // strict present-only number.
  const presentPct = total ? Math.round(((present + late * 0.5) / total) * 1000) / 10 : 0;
  const presentOnlyPct = total ? Math.round((present / total) * 1000) / 10 : 0;
  return {
    total, present, absent, late, presentPct, presentOnlyPct,
    absentPct: total ? Math.round((absent / total) * 1000) / 10 : 0,
    latePct: total ? Math.round((late / total) * 1000) / 10 : 0,
  };
}

function monthlySeries(studentId, attendance) {
  const recs = attendance.filter(a => a.student_id === studentId);
  const byMonth = {};
  recs.forEach(r => {
    const m = r.date.slice(0, 7);
    byMonth[m] = byMonth[m] || { present: 0, total: 0 };
    byMonth[m].total += 1;
    if (r.status === 'present') byMonth[m].present += 1;
  });
  return Object.entries(byMonth).sort((a, b) => a[0].localeCompare(b[0])).slice(-6)
    .map(([month, v]) => ({ month: month.slice(5), rate: Math.round((v.present / v.total) * 100) }));
}

// Per-period present/late/absent composition for the Dashboard trend chart.
// Periods with no records come back with total 0 so the chart renders them
// as gaps instead of fake zeros. Weekly = last 7 days, monthly = last 6
// months, yearly = every year with data (max 6). All rates keep the "late
// counts as half credit" convention.
function clubTrendSeries(attendance, granularity) {
  const now = new Date();
  if (granularity === 'weekly') {
    const out = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(now); d.setDate(d.getDate() - i);
      out.push({ label: d.toLocaleDateString('en-US', { weekday: 'short' }), ...attendanceBreakdown(attendance.filter(a => a.date === ymd(d))) });
    }
    return out;
  }
  if (granularity === 'yearly') {
    return [...attendanceYears(attendance)].sort((a, b) => a.localeCompare(b)).slice(-6)
      .map(y => ({ label: y, ...attendanceBreakdown(attendance.filter(a => a.date.startsWith(y))) }));
  }
  const byMonth = {};
  attendance.forEach(r => {
    const m = r.date.slice(0, 7);
    (byMonth[m] = byMonth[m] || []).push(r);
  });
  return Object.keys(byMonth).sort().slice(-6)
    .map(m => ({ label: MONTH_LABELS[Number(m.slice(5)) - 1], ...attendanceBreakdown(byMonth[m]) }));
}

const DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

// Auto-generated insights for the Dashboard trend card — the "what should I
// actually do about this" layer on top of the raw chart. Returns up to 4
// { icon, tint, text } rows, most actionable first.
function clubTrendInsights(attendance, sessions, students, series) {
  const out = [];
  const withData = series.filter(p => p.total > 0);

  // 1 — Direction of travel: later half of the range vs the earlier half.
  if (withData.length >= 2) {
    const half = Math.ceil(withData.length / 2);
    const earlier = withData.slice(0, half).reduce((s, p) => s + p.rate, 0) / half;
    const later = withData.slice(half).reduce((s, p) => s + p.rate, 0) / (withData.length - half);
    const delta = Math.round((later - earlier) * 10) / 10;
    if (delta > 0.4) out.push({ icon: TrendingUp, tint: SUCCESS, text: `Attendance is improving — up ${delta} pts versus the earlier period` });
    else if (delta < -0.4) out.push({ icon: TrendingDown, tint: DANGER, text: `Attendance is slipping — down ${Math.abs(delta)} pts versus the earlier period` });
    else out.push({ icon: Activity, tint: '#6B7280', text: 'Attendance has held steady across these periods' });
  }

  // 2 — Session comparison, only when multiple sessions actually have data.
  if (sessions.length >= 2) {
    const perSession = sessions.map(s => ({
      s,
      ...attendanceBreakdown(attendance.filter(a => (a.session_id || null) === s.id)),
    })).filter(x => x.total > 0).sort((a, b) => b.rate - a.rate);
    if (perSession.length >= 2) {
      const top = perSession[0], bottom = perSession[perSession.length - 1];
      const diff = Math.round((top.rate - bottom.rate) * 10) / 10;
      if (diff >= 3) out.push({ icon: Clock, tint: ROYAL, text: `${top.s.title} draws stronger turnout than ${bottom.s.title} (+${diff} pts)` });
    }
  }

  // 3 — Day-of-week pattern across all data.
  const dowRates = DAY_NAMES.map((name, dow) => {
    const b = attendanceBreakdown(attendance.filter(a => new Date(a.date + 'T00:00:00').getDay() === dow));
    return { name, ...b };
  }).filter(x => x.total > 0);
  if (dowRates.length >= 2) {
    const best = dowRates.reduce((a, b) => (b.rate > a.rate ? b : a));
    out.push({ icon: Calendar, tint: SUCCESS, text: `${best.name}s are your highest-attendance day (${best.rate}%)` });
  }

  // 4 — Punctuality: share of all marks that were "late".
  if (attendance.length > 0) {
    const lateShare = Math.round((attendance.filter(r => r.status === 'late').length / attendance.length) * 1000) / 10;
    if (lateShare >= 5) out.push({ icon: Clock, tint: WARNING, text: `${lateShare}% of all marks are "late" — punctuality could be tightened` });
  }

  // 5 — Absence streaks: students not seen in 2+ weeks.
  if (students.length > 0) {
    const today = todayISO();
    const atRisk = students.filter(s => {
      const st = studentAbsenceStatus(attendance, s.id, today);
      return st && st.days > ABSENCE_ALERT_DAYS;
    });
    if (atRisk.length > 0) out.push({ icon: AlertTriangle, tint: DANGER, text: `${atRisk.length} student${atRisk.length === 1 ? '' : 's'} haven't been seen in 2+ weeks — worth a follow-up` });
  }

  return out.slice(0, 4);
}

// ----------------------------------------------------------------------------
// Analytics helpers — pure functions over the attendance array, all keeping
// the same "late counts as half credit" convention as statsFor/dayBreakdown.
// ----------------------------------------------------------------------------
const MONTH_LABELS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

// Distinct years present in the attendance data, most recent first — powers
// the year filter on the Analytics screen.
function attendanceYears(attendance) {
  const years = new Set(attendance.map(a => a.date.slice(0, 4)));
  return Array.from(years).sort((a, b) => b.localeCompare(a));
}

// Present/late/absent breakdown for whatever slice of attendance records is
// passed in — the caller does any year/session filtering beforehand.
function attendanceBreakdown(attendance) {
  const total = attendance.length;
  const present = attendance.filter(r => r.status === 'present').length;
  const late = attendance.filter(r => r.status === 'late').length;
  const absent = attendance.filter(r => r.status === 'absent').length;
  const rate = total ? Math.round(((present + late * 0.5) / total) * 1000) / 10 : 0;
  return { total, present, late, absent, rate };
}

// Resolves a "period" (day/week/month/year) plus an anchor date into an
// inclusive [start, end] ISO date range — powers the Attendance Breakdown
// pie chart's Day/Week/Month/Year picker. Week runs Monday–Sunday.
function periodRange(period, anchorIso) {
  const d = new Date(anchorIso + 'T00:00:00');
  if (period === 'day') return { start: anchorIso, end: anchorIso };
  if (period === 'week') {
    const day = d.getDay();
    const diffToMonday = day === 0 ? -6 : 1 - day;
    const start = new Date(d); start.setDate(d.getDate() + diffToMonday);
    const end = new Date(start); end.setDate(start.getDate() + 6);
    return { start: ymd(start), end: ymd(end) };
  }
  if (period === 'month') {
    const start = new Date(d.getFullYear(), d.getMonth(), 1);
    const end = new Date(d.getFullYear(), d.getMonth() + 1, 0);
    return { start: ymd(start), end: ymd(end) };
  }
  if (period === 'year') return { start: `${d.getFullYear()}-01-01`, end: `${d.getFullYear()}-12-31` };
  return null; // 'all'
}

// Human-readable label for the currently selected period, shown next to the
// date picker (e.g. "Week of 11–17 Aug 2026").
function formatPeriodLabel(period, anchorIso) {
  const d = new Date(anchorIso + 'T00:00:00');
  if (period === 'day') return d.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  if (period === 'week') {
    const range = periodRange('week', anchorIso);
    const s = new Date(range.start + 'T00:00:00'), e = new Date(range.end + 'T00:00:00');
    const startStr = s.toLocaleDateString('en-US', { day: 'numeric', month: s.getMonth() === e.getMonth() ? undefined : 'short' });
    const endStr = e.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });
    return `Week of ${startStr}–${endStr}`;
  }
  if (period === 'month') return d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  if (period === 'year') return String(d.getFullYear());
  return 'All Time';
}

// One point per calendar day for the last `numDays` days (today inclusive).
function dailyRateSeries(attendance, numDays) {
  const now = new Date();
  const out = [];
  for (let i = numDays - 1; i >= 0; i--) {
    const d = new Date(now); d.setDate(d.getDate() - i);
    const iso = ymd(d);
    const b = attendanceBreakdown(attendance.filter(a => a.date === iso));
    out.push({ label: d.toLocaleDateString('en-US', { day: 'numeric', month: 'short' }), rate: b.rate, total: b.total });
  }
  return out;
}

// Jan-Dec rate for one specific calendar year.
function monthlyRateSeriesForYear(attendance, year) {
  return MONTH_LABELS.map((label, i) => {
    const prefix = `${year}-${String(i + 1).padStart(2, '0')}`;
    const b = attendanceBreakdown(attendance.filter(a => a.date.startsWith(prefix)));
    return { label, rate: b.rate, total: b.total };
  });
}

// Rolling last 12 calendar months, used when no specific year is selected.
function monthlyRateSeriesRolling(attendance) {
  const now = new Date();
  const out = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const prefix = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    const b = attendanceBreakdown(attendance.filter(a => a.date.startsWith(prefix)));
    out.push({ label: `${MONTH_LABELS[d.getMonth()]} '${String(d.getFullYear()).slice(2)}`, rate: b.rate, total: b.total });
  }
  return out;
}

// One bar per year the club has any attendance data for — the all-time
// overall trend, unaffected by the year filter (only by the session filter).
function yearlyRateSeries(attendance) {
  const years = [...attendanceYears(attendance)].sort((a, b) => a.localeCompare(b));
  return years.map(y => {
    const b = attendanceBreakdown(attendance.filter(a => a.date.startsWith(y)));
    return { label: y, rate: b.rate, total: b.total };
  });
}

const ABSENCE_ALERT_DAYS = 14;

// How long it's been since a student last showed up as present/late — used
// to flag long absence streaks rather than just a low attendance percentage
// (a student with one absence out of one session isn't "needs attention" the
// way someone who hasn't shown up in a month is). Returns null for students
// with no attendance records at all in the given slice.
function studentAbsenceStatus(attendance, studentId, todayIso) {
  const recs = attendance.filter(a => a.student_id === studentId);
  if (recs.length === 0) return null;
  const attendedDates = recs.filter(r => r.status === 'present' || r.status === 'late').map(r => r.date).sort();
  const lastAttended = attendedDates.length ? attendedDates[attendedDates.length - 1] : null;
  // Never attended a single session: count the streak from their earliest
  // record so a long-absent brand-new student still surfaces.
  const since = lastAttended || recs.map(r => r.date).sort()[0];
  const days = Math.round((new Date(todayIso) - new Date(since)) / 86400000);
  return { days, lastAttended };
}

const WEEKDAY_LABELS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

function sessionsForDate(sessions, dateISO) {
  const d = new Date(dateISO + 'T00:00:00');
  const dow = d.getDay();
  const isToday = dateISO === todayISO();
  const now = new Date();
  const hhmm = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  return sessions.filter(s => s.days.includes(dow)).sort((a, b) => a.time.localeCompare(b.time))
    .map(s => ({ ...s, computedStatus: (!isToday || s.time <= hhmm) ? 'Completed' : 'Upcoming' }));
}

function sessionsForToday(sessions) {
  return sessionsForDate(sessions, todayISO());
}

// Day-level breakdown for a given date (+ optional session filter) — powers
// the "analyze each day" attendance view.
function dayBreakdown(attendance, dateISO, sessionId) {
  const recs = attendance.filter(a => a.date === dateISO && (sessionId === undefined || (a.session_id || null) === (sessionId || null)));
  const present = recs.filter(r => r.status === 'present').length;
  const absent = recs.filter(r => r.status === 'absent').length;
  const late = recs.filter(r => r.status === 'late').length;
  const total = recs.length;
  const rate = total ? Math.round(((present + late * 0.5) / total) * 1000) / 10 : 0;
  return { total, present, absent, late, rate };
}
// Minimal QR Code encoder — Version 2, Error Correction Level M, Byte mode.
// Self-contained (no external library), verified against a Python/OpenCV
// decode round-trip before porting.

const QR_SIZE = 25;
const QR_DATA_CW = 28;
const QR_EC_CW = 16;

function qrBuildGF() {
  const EXP = new Array(512).fill(0);
  const LOG = new Array(256).fill(0);
  let x = 1;
  for (let i = 0; i < 255; i++) {
    EXP[i] = x;
    LOG[x] = i;
    x <<= 1;
    if (x & 0x100) x ^= 0x11D;
  }
  for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  return { EXP, LOG };
}
const { EXP: QR_EXP, LOG: QR_LOG } = qrBuildGF();

function qrGmul(a, b) {
  if (a === 0 || b === 0) return 0;
  return QR_EXP[QR_LOG[a] + QR_LOG[b]];
}
function qrPolyMul(p, q) {
  const r = new Array(p.length + q.length - 1).fill(0);
  for (let i = 0; i < p.length; i++) {
    if (p[i] === 0) continue;
    for (let j = 0; j < q.length; j++) {
      r[i + j] ^= qrGmul(p[i], q[j]);
    }
  }
  return r;
}
function qrGeneratorPoly(nsym) {
  let g = [1];
  for (let i = 0; i < nsym; i++) g = qrPolyMul(g, [1, QR_EXP[i]]);
  return g;
}
function qrRsEncode(data, nsym) {
  const gen = qrGeneratorPoly(nsym);
  const msg = data.slice();
  for (let i = 0; i < nsym; i++) msg.push(0);
  for (let i = 0; i < data.length; i++) {
    const coef = msg[i];
    if (coef !== 0) {
      for (let j = 0; j < gen.length; j++) msg[i + j] ^= qrGmul(gen[j], coef);
    }
  }
  return msg.slice(data.length);
}

function qrEncodeBytes(text) {
  const dataBytes = Array.from(new TextEncoder().encode(text));
  if (dataBytes.length > QR_DATA_CW - 3) {
    // Defensive truncation — admission IDs are always well under this,
    // this just guarantees we never produce a corrupt/unscannable code.
    dataBytes.length = QR_DATA_CW - 3;
  }
  const bits = [];
  const push = (val, n) => { for (let i = n - 1; i >= 0; i--) bits.push((val >> i) & 1); };
  push(0b0100, 4);
  push(dataBytes.length, 8);
  for (const b of dataBytes) push(b, 8);
  const capBits = QR_DATA_CW * 8;
  const term = Math.min(4, capBits - bits.length);
  push(0, term);
  while (bits.length % 8 !== 0) bits.push(0);
  const cws = [];
  for (let i = 0; i < bits.length; i += 8) {
    let byte = 0;
    for (let j = 0; j < 8; j++) byte = (byte << 1) | bits[i + j];
    cws.push(byte);
  }
  const pad = [0xEC, 0x11];
  let pi = 0;
  while (cws.length < QR_DATA_CW) cws.push(pad[pi++ % 2]);
  return cws;
}

function qrMaskFn(pat, r, c) {
  switch (pat) {
    case 0: return (r + c) % 2 === 0 ? 1 : 0;
    case 1: return r % 2 === 0 ? 1 : 0;
    case 2: return c % 3 === 0 ? 1 : 0;
    case 3: return (r + c) % 3 === 0 ? 1 : 0;
    case 4: return ((Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0) ? 1 : 0;
    case 5: return (((r * c) % 2) + ((r * c) % 3) === 0) ? 1 : 0;
    case 6: return ((((r * c) % 2) + ((r * c) % 3)) % 2 === 0) ? 1 : 0;
    case 7: return ((((r + c) % 2) + ((r * c) % 3)) % 2 === 0) ? 1 : 0;
    default: return 0;
  }
}

function qrBuildMatrix(dataCws, maskPattern) {
  const size = QR_SIZE;
  const mat = Array.from({ length: size }, () => new Array(size).fill(null));
  const reserved = Array.from({ length: size }, () => new Array(size).fill(false));
  const setM = (r, c, v) => { mat[r][c] = v; reserved[r][c] = true; };

  const placeFinder = (r0, c0) => {
    for (let i = -1; i < 8; i++) {
      for (let j = -1; j < 8; j++) {
        const rr = r0 + i, cc = c0 + j;
        if (rr < 0 || rr >= size || cc < 0 || cc >= size) continue;
        if (i >= 0 && i <= 6 && j >= 0 && j <= 6 && (i === 0 || i === 6 || j === 0 || j === 6 || (i >= 2 && i <= 4 && j >= 2 && j <= 4))) {
          setM(rr, cc, 1);
        } else {
          setM(rr, cc, 0);
        }
      }
    }
  };
  placeFinder(0, 0);
  placeFinder(0, size - 7);
  placeFinder(size - 7, 0);

  for (let i = 8; i < size - 8; i++) {
    const val = i % 2 === 0 ? 1 : 0;
    setM(6, i, val); setM(i, 6, val);
  }

  const ar = 18, ac = 18;
  for (let i = -2; i <= 2; i++) {
    for (let j = -2; j <= 2; j++) {
      const v = (Math.max(Math.abs(i), Math.abs(j)) === 2 || (i === 0 && j === 0)) ? 1 : 0;
      setM(ar + i, ac + j, v);
    }
  }

  setM(17, 8, 1); // dark module, version 2

  for (let i = 0; i <= 8; i++) { reserved[8][i] = true; reserved[i][8] = true; }
  for (let i = size - 8; i < size; i++) reserved[8][i] = true;
  for (let i = size - 7; i < size; i++) reserved[i][8] = true;

  const totalBits = [];
  for (const cw of dataCws) for (let i = 7; i >= 0; i--) totalBits.push((cw >> i) & 1);

  let bitIdx = 0, col = size - 1, upward = true;
  while (col > 0) {
    if (col === 6) col -= 1;
    for (let ri = 0; ri < size; ri++) {
      const row = upward ? (size - 1 - ri) : ri;
      for (const c of [col, col - 1]) {
        if (!reserved[row][c] && mat[row][c] === null) {
          const bit = bitIdx < totalBits.length ? totalBits[bitIdx] : 0;
          bitIdx++;
          const m = qrMaskFn(maskPattern, row, c);
          mat[row][c] = bit ^ m;
        }
      }
    }
    upward = !upward;
    col -= 2;
  }
  return mat;
}

function qrPlaceFormatInfo(mat, eccBits, maskPattern) {
  const size = QR_SIZE;
  const data = (eccBits << 3) | maskPattern;
  const g = 0x537;
  let tmp = data << 10;
  const val = tmp;
  for (let i = 4; i >= 0; i--) {
    if (tmp & (1 << (i + 10))) tmp ^= g << i;
  }
  const fmt = (val ^ tmp) ^ 0x5412;
  const bits = [];
  for (let i = 14; i >= 0; i--) bits.push((fmt >> i) & 1);

  const seqA = [[8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,7],[8,8],[7,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8]];
  seqA.forEach(([r, c], k) => { mat[r][c] = bits[k]; });
  const seqB = [[size-1,8],[size-2,8],[size-3,8],[size-4,8],[size-5,8],[size-6,8],[size-7,8],
    [8,size-8],[8,size-7],[8,size-6],[8,size-5],[8,size-4],[8,size-3],[8,size-2],[8,size-1]];
  seqB.forEach(([r, c], k) => { mat[r][c] = bits[k]; });
  return mat;
}

function qrPenaltyScore(mat) {
  const size = mat.length;
  let score = 0;
  for (let r = 0; r < size; r++) {
    let run = 1;
    for (let c = 1; c < size; c++) {
      if (mat[r][c] === mat[r][c - 1]) run++;
      else { if (run >= 5) score += run - 2; run = 1; }
    }
    if (run >= 5) score += run - 2;
  }
  for (let c = 0; c < size; c++) {
    let run = 1;
    for (let r = 1; r < size; r++) {
      if (mat[r][c] === mat[r - 1][c]) run++;
      else { if (run >= 5) score += run - 2; run = 1; }
    }
    if (run >= 5) score += run - 2;
  }
  for (let r = 0; r < size - 1; r++) {
    for (let c = 0; c < size - 1; c++) {
      const v = mat[r][c];
      if (v === mat[r][c + 1] && v === mat[r + 1][c] && v === mat[r + 1][c + 1]) score += 3;
    }
  }
  let dark = 0;
  for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) dark += mat[r][c];
  const pct = Math.floor((dark * 100) / (size * size));
  const prev = pct - (pct % 5);
  const nextm = prev + 5;
  score += Math.min(Math.abs(prev - 50) / 5, Math.abs(nextm - 50) / 5) * 10;
  return score;
}

const QR_ECC_M_INDICATOR = 0b00;

/** Returns a 25x25 matrix (array of arrays of 0/1) encoding `text`. */
function generateQrMatrix(text) {
  const dataCws = qrEncodeBytes(text);
  const ecCws = qrRsEncode(dataCws, QR_EC_CW);
  const allCws = dataCws.concat(ecCws);
  let best = null;
  for (let mp = 0; mp < 8; mp++) {
    const mat = qrBuildMatrix(allCws, mp);
    const mat2 = mat.map(row => row.slice());
    qrPlaceFormatInfo(mat2, QR_ECC_M_INDICATOR, mp);
    const sc = qrPenaltyScore(mat2);
    if (best === null || sc < best.sc) best = { sc, mat: mat2 };
  }
  return best.mat;
}


function useAuth(supabaseClient) {
  const [session, setSession] = React.useState(undefined);
  const [profile, setProfile] = React.useState(null);
  const [profileError, setProfileError] = React.useState(null);
  const [loading, setLoading] = React.useState(true);

  const loadProfile = React.useCallback(async (userId) => {
    const { data, error } = await supabaseClient.from('profiles').select('*').eq('id', userId).single();
    if (error) { console.error('Failed to load profile:', error); setProfile(null); setProfileError(error); }
    else { setProfile(data); setProfileError(null); }
  }, [supabaseClient]);

  React.useEffect(() => {
    let cancelled = false;
    supabaseClient.auth.getSession().then(async ({ data }) => {
      if (cancelled) return;
      setSession(data.session ?? null);
      if (data.session) await loadProfile(data.session.user.id);
      setLoading(false);
    });
    const { data: sub } = supabaseClient.auth.onAuthStateChange(async (_event, newSession) => {
      setSession(newSession);
      if (newSession) await loadProfile(newSession.user.id);
      else setProfile(null);
    });
    return () => { cancelled = true; sub.subscription.unsubscribe(); };
  }, [loadProfile, supabaseClient]);

  const signIn = React.useCallback(async (email, password) => {
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    return error;
  }, [supabaseClient]);

  const signOut = React.useCallback(async () => { await supabaseClient.auth.signOut(); }, [supabaseClient]);
  const refreshProfile = React.useCallback(() => { if (session?.user?.id) return loadProfile(session.user.id); }, [session, loadProfile]);

  return { session, profile, profileError, loading, signIn, signOut, refreshProfile };
}
function useClubData(supabaseClient, supabaseSecondaryClient, enabled) {
  const [students, setStudents] = React.useState([]);
  const [attendance, setAttendance] = React.useState([]);
  const [achievements, setAchievements] = React.useState([]);
  const [tournaments, setTournaments] = React.useState([]);
  const [tournamentSeries, setTournamentSeries] = React.useState([]);
  const [tournamentEvents, setTournamentEvents] = React.useState([]);
  const [eventRegistrations, setEventRegistrations] = React.useState([]);
  const [sessions, setSessions] = React.useState([]);
  const [settings, setSettings] = React.useState({ id: 1, weight_attendance: 0.6 });
  const [profiles, setProfiles] = React.useState([]);
  const [loading, setLoading] = React.useState(true);

  const refetch = React.useCallback(async (table) => {
    const setters = {
      students: setStudents, attendance: setAttendance, achievements: setAchievements, tournaments: setTournaments,
      tournament_series: setTournamentSeries, tournament_events: setTournamentEvents, event_registrations: setEventRegistrations,
      sessions: setSessions, profiles: setProfiles,
    };
    if (table === 'club_settings') {
      const { data } = await supabaseClient.from('club_settings').select('*').eq('id', 1).single();
      if (data) setSettings(data);
      return;
    }
    // Archived (soft-deleted) students are hidden from every listing the app
    // builds from this list, but their rows remain in the DB for the record.
    let query = supabaseClient.from(table).select('*');
    if (table === 'students') query = query.is('deleted_at', null);
    const { data, error } = await query;
    if (error) { console.error(`Failed to load ${table}:`, error); return; }
    setters[table]?.(data || []);
  }, [supabaseClient]);

  const refetchAll = React.useCallback(async () => {
    await Promise.all([
      refetch('students'), refetch('attendance'), refetch('achievements'), refetch('tournaments'),
      refetch('tournament_series'), refetch('tournament_events'), refetch('event_registrations'),
      refetch('sessions'), refetch('club_settings'), refetch('profiles'),
    ]);
  }, [refetch]);

  // Apply a realtime change to local state directly instead of re-downloading
  // the whole table. This keeps cross-device sync instant and cheap; full
  // refetches only happen after our own mutations or an explicit refresh.
  const applyChange = React.useCallback((table, payload) => {
    const setters = {
      students: setStudents, attendance: setAttendance, achievements: setAchievements, tournaments: setTournaments,
      tournament_series: setTournamentSeries, tournament_events: setTournamentEvents, event_registrations: setEventRegistrations,
      sessions: setSessions, profiles: setProfiles,
    };
    const { eventType, new: row, old: oldRow } = payload;
    if (table === 'club_settings' && row && eventType === 'UPDATE') { setSettings(row); return; }
    const setter = setters[table];
    if (!setter || !row) return;
    setter(prev => {
      switch (eventType) {
        case 'INSERT':
          if (table === 'students' && row.deleted_at) return prev;
          return prev.some(r => r.id === row.id) ? prev : [row, ...prev];
        case 'UPDATE':
          if (table === 'students' && row.deleted_at) return prev.filter(r => r.id !== row.id);
          return prev.map(r => (r.id === row.id ? row : r));
        case 'DELETE':
          return prev.filter(r => r.id !== (oldRow && oldRow.id));
        default:
          return prev;
      }
    });
  }, []);

  React.useEffect(() => {
    if (!enabled) { setLoading(false); return; }
    let cancelled = false;
    (async () => { await refetchAll(); if (!cancelled) setLoading(false); })();
    const channel = supabaseClient.channel('club-data-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'students' }, p => applyChange('students', p))
      .on('postgres_changes', { event: '*', schema: 'public', table: 'attendance' }, p => applyChange('attendance', p))
      .on('postgres_changes', { event: '*', schema: 'public', table: 'achievements' }, p => applyChange('achievements', p))
      .on('postgres_changes', { event: '*', schema: 'public', table: 'sessions' }, p => applyChange('sessions', p))
      .on('postgres_changes', { event: '*', schema: 'public', table: 'tournament_events' }, p => applyChange('tournament_events', p))
      .on('postgres_changes', { event: '*', schema: 'public', table: 'event_registrations' }, p => applyChange('event_registrations', p))
      .subscribe();
    return () => { cancelled = true; supabaseClient.removeChannel(channel); };
  }, [enabled, refetchAll, applyChange, supabaseClient]);

  // No admission_id from the client — the DB trigger assigns it (see
  // database-schema.sql: assign_admission_id). We select() the inserted row
  // so the roster gets the server-assigned ID immediately.
  const addStudent = React.useCallback(async (student) => {
    const { admission_id, ...rest } = student;
    const { data, error } = await supabaseClient.from('students').insert(rest).select().single();
    if (error) throw error;
    if (data) setStudents(prev => prev.some(r => r.id === data.id) ? prev : [data, ...prev]);
  }, [supabaseClient]);
  // CSV import: one batched INSERT, select() returns every row with its
  // server-assigned admission_id so the roster updates immediately.
  const addStudentsBatch = React.useCallback(async (students) => {
    if (!students.length) return;
    const { data, error } = await supabaseClient.from('students').insert(students).select();
    if (error) throw error;
    if (data && data.length) setStudents(prev => {
      const ids = new Set(prev.map(r => r.id));
      return [...data.filter(r => !ids.has(r.id)), ...prev];
    });
  }, [supabaseClient]);
  const updateStudent = React.useCallback(async (student) => { const { id, ...rest } = student; const { error } = await supabaseClient.from('students').update(rest).eq('id', id); if (error) throw error; await refetch('students'); }, [refetch, supabaseClient]);
  // Soft delete: mark the row archived instead of destroying the student's
  // attendance/achievement history. Parent profiles are unlinked so the
  // archived student disappears from their view, but all records survive.
  const deleteStudent = React.useCallback(async (id) => {
    await supabaseClient.from('profiles').update({ student_id: null }).eq('student_id', id);
    const { error } = await supabaseClient.from('students').update({ deleted_at: new Date().toISOString() }).eq('id', id);
    if (error) throw error;
    setStudents(prev => prev.filter(s => s.id !== id));
    await refetch('profiles');
  }, [refetch, supabaseClient]);

  // Race-safe: try INSERT first. If another coach (or another device) already
  // marked this student a moment ago, the unique constraint fires 23505 and
  // we switch to an UPDATE instead of erroring out.
  const markAttendance = React.useCallback(async (rec) => {
    const { error: insErr } = await supabaseClient.from('attendance').insert(rec);
    if (!insErr) { await refetch('attendance'); return; }
    if (insErr.code === '23505') {
      let query = supabaseClient.from('attendance').update(rec).eq('student_id', rec.student_id).eq('date', rec.date);
      query = rec.session_id ? query.eq('session_id', rec.session_id) : query.is('session_id', null);
      const { error } = await query;
      if (error) throw error;
      await refetch('attendance');
      return;
    }
    throw insErr;
  }, [refetch, supabaseClient]);

  const deleteAttendance = React.useCallback(async (id) => {
    const { error } = await supabaseClient.from('attendance').delete().eq('id', id);
    if (error) throw error;
    await refetch('attendance');
  }, [refetch, supabaseClient]);

  const markAllAbsent = React.useCallback(async ({ date, session_id, studentIds, marked_by }) => {
    if (!studentIds || studentIds.length === 0) return;
    const rows = studentIds.map(student_id => ({ student_id, date, session_id: session_id || null, status: 'absent', marked_by, notes: null }));
    // Fast path: one bulk insert. If any student was already marked (possibly
    // by another coach a moment ago), fall back to insert-or-update per row so
    // the whole batch doesn't fail on one duplicate.
    const { error: bulkErr } = await supabaseClient.from('attendance').insert(rows);
    if (!bulkErr) { await refetch('attendance'); return; }
    if (bulkErr.code === '23505') {
      for (const rec of rows) {
        const { error: insErr } = await supabaseClient.from('attendance').insert(rec);
        if (!insErr) continue;
        if (insErr.code === '23505') {
          let query = supabaseClient.from('attendance').update(rec).eq('student_id', rec.student_id).eq('date', rec.date);
          query = rec.session_id ? query.eq('session_id', rec.session_id) : query.is('session_id', null);
          const { error } = await query;
          if (error) throw error;
        } else {
          throw insErr;
        }
      }
      await refetch('attendance');
      return;
    }
    throw bulkErr;
  }, [refetch, supabaseClient]);

  const addAchievement = React.useCallback(async (a) => { const { error } = await supabaseClient.from('achievements').insert(a); if (error) throw error; await refetch('achievements'); }, [refetch, supabaseClient]);
  const updateAchievement = React.useCallback(async (a) => { const { id, ...rest } = a; const { error } = await supabaseClient.from('achievements').update(rest).eq('id', id); if (error) throw error; await refetch('achievements'); }, [refetch, supabaseClient]);
  const deleteAchievement = React.useCallback(async (id) => { const { error } = await supabaseClient.from('achievements').delete().eq('id', id); if (error) throw error; await refetch('achievements'); }, [refetch, supabaseClient]);

  const addTournament = React.useCallback(async (t) => {
    const { data, error } = await supabaseClient.from('tournaments').insert(t).select().single();
    if (error) throw error;
    await refetch('tournaments');
    return data;
  }, [refetch, supabaseClient]);
  const updateTournament = React.useCallback(async (t) => { const { id, ...rest } = t; const { error } = await supabaseClient.from('tournaments').update(rest).eq('id', id); if (error) throw error; await refetch('tournaments'); }, [refetch, supabaseClient]);
  const deleteTournament = React.useCallback(async (id) => {
    const { error } = await supabaseClient.from('tournaments').delete().eq('id', id);
    if (error) throw error;
    await Promise.all([refetch('tournaments'), refetch('tournament_events'), refetch('event_registrations'), refetch('achievements')]);
  }, [refetch, supabaseClient]);

  const addSeries = React.useCallback(async (s) => {
    const { data, error } = await supabaseClient.from('tournament_series').insert(s).select().single();
    if (error) throw error;
    await refetch('tournament_series');
    return data;
  }, [refetch, supabaseClient]);

  const addEvent = React.useCallback(async (e) => {
    const { data, error } = await supabaseClient.from('tournament_events').insert(e).select().single();
    if (error) throw error;
    await refetch('tournament_events');
    return data;
  }, [refetch, supabaseClient]);
  const deleteEvent = React.useCallback(async (id) => {
    const { error } = await supabaseClient.from('tournament_events').delete().eq('id', id);
    if (error) throw error;
    await Promise.all([refetch('tournament_events'), refetch('event_registrations'), refetch('achievements')]);
  }, [refetch, supabaseClient]);

  const registerForEvent = React.useCallback(async (reg) => {
    const { error } = await supabaseClient.from('event_registrations').insert(reg);
    if (error && error.code !== '23505') throw error; // ignore duplicate-registration conflicts
    await refetch('event_registrations');
  }, [refetch, supabaseClient]);
  const unregisterFromEvent = React.useCallback(async (id) => {
    const { error } = await supabaseClient.from('event_registrations').delete().eq('id', id);
    if (error) throw error;
    await refetch('event_registrations');
  }, [refetch, supabaseClient]);

  const addSession = React.useCallback(async (s) => { const { error } = await supabaseClient.from('sessions').insert(s); if (error) throw error; await refetch('sessions'); }, [refetch, supabaseClient]);
  const deleteSession = React.useCallback(async (id) => { const { error } = await supabaseClient.from('sessions').delete().eq('id', id); if (error) throw error; await refetch('sessions'); }, [refetch, supabaseClient]);
  const updateSettings = React.useCallback(async (patch) => { const { error } = await supabaseClient.from('club_settings').update(patch).eq('id', 1); if (error) throw error; await refetch('club_settings'); }, [refetch, supabaseClient]);
  const updateOwnProfile = React.useCallback(async (userId, patch) => { const { error } = await supabaseClient.from('profiles').update(patch).eq('id', userId); if (error) throw error; await refetch('profiles'); }, [refetch, supabaseClient]);

  const createParentAccount = React.useCallback(async ({ email, password, studentId, name }) => {
    const { data, error } = await supabaseSecondaryClient.auth.signUp({ email, password, options: { data: { role: 'parent', name } } });
    if (error) throw error;
    if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
      await supabaseSecondaryClient.auth.signOut();
      throw new Error('That email is already registered to an account. Use a different email for this parent.');
    }
    const newUserId = data.user?.id;
    if (newUserId) {
      await new Promise(r => setTimeout(r, 500));
      await supabaseClient.from('profiles').update({ role: 'parent', name, student_id: studentId }).eq('id', newUserId);
    }
    await supabaseSecondaryClient.auth.signOut();
    await refetch('profiles');
  }, [refetch, supabaseClient, supabaseSecondaryClient]);

  const resetParentPassword = React.useCallback(async (userId, newPassword) => {
    // The DB generates a random password unless one is supplied, and returns
    // it so the coach can share it. Never a fixed default.
    const { data, error } = await supabaseClient.rpc('admin_reset_parent_password', {
      target_user_id: userId, new_password: newPassword || null,
    });
    if (error) throw error;
    return data;
  }, [supabaseClient]);

  const createParentAccountByPhone = React.useCallback(async ({ phone, studentId, name, password }) => {
    const { data, error } = await supabaseClient.rpc('admin_create_parent_login', {
      student_id: studentId, login_phone: phone, parent_name: name, new_password: password || null,
    });
    if (error) throw error;
    await refetch('profiles');
    return data; // the generated password
  }, [refetch, supabaseClient]);

  return {
    students, attendance, achievements, tournaments, tournamentSeries, tournamentEvents, eventRegistrations, sessions, settings, profiles, loading,
    addStudent, addStudentsBatch, updateStudent, deleteStudent, markAttendance, deleteAttendance, markAllAbsent,
    addAchievement, updateAchievement, deleteAchievement,
    addTournament, updateTournament, deleteTournament, addSeries,
    addEvent, deleteEvent, registerForEvent, unregisterFromEvent,
    addSession, deleteSession, updateSettings, updateOwnProfile, createParentAccount, createParentAccountByPhone, resetParentPassword, refetchAll,
  };
}

// Downloads an array of rows as a CSV file. Handles quoting/escaping (Excel-
// safe), UTF-8 BOM so Sinhala/emoji names open correctly, and \r\n line
// endings per the CSV spec.
function downloadCSV(filename, headers, rows) {
  const esc = (v) => {
    const s = String(v ?? '');
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const csv = [headers, ...rows].map(r => r.map(esc).join(',')).join('\r\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// --- CSV import -----------------------------------------------------
// RFC-4180-ish parser: quoted fields, escaped quotes, \r\n or \n, BOM.
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  const s = String(text || '').replace(/^\ufeff/, '');
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (inQuotes) {
      if (c === '"') {
        if (s[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else if (c !== '\r') field += c;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}

function normalizeISODate(v) {
  const s = String(v || '').trim();
  if (!s) return '';
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const m = s.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{2,4})$/);
  if (m) {
    let [, dd, mm, yy] = m;
    if (yy.length === 2) yy = '20' + yy;
    const y = Number(yy), mo = Number(mm), d = Number(dd);
    if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31 && y >= 1900 && y <= 2100) return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  }
  const parsed = new Date(s);
  if (!isNaN(parsed.getTime()) && parsed.getFullYear() >= 1900 && parsed.getFullYear() <= 2100) {
    return `${parsed.getFullYear()}-${String(parsed.getMonth() + 1).padStart(2, '0')}-${String(parsed.getDate()).padStart(2, '0')}`;
  }
  return '';
}

function normalizeBelt(v) {
  const s = String(v || '').trim();
  if (!s) return null;
  const n = s.toLowerCase().replace(/[^a-z0-9]/g, '');
  if (/^(black|blackbelt|1stdan|dan\d*|shodan)/.test(n)) return 'Black';
  let word = s.split(/\s+/)[0].toLowerCase();
  if (word === 'grey') word = 'yellow';
  return BELTS.find(b => b.toLowerCase().replace(/[^a-z0-9]/g, '') === n)
    || BELTS.find(b => b.toLowerCase().split(' ')[0] === word)
    || null;
}

// Maps CSV rows to student records. Returns { valid, skipped } where skipped
// is [{ row, name, reason }] — row numbers are 1-based file lines.
function csvToStudents(headers, rows, roster) {
  const idx = {};
  headers.forEach((h, i) => {
    const t = normHeaderToken(h);
    if (!t || CSV_IGNORED_HEADERS.includes(t)) return;
    for (const [key, aliases] of Object.entries(CSV_HEADER_MAP)) {
      if (aliases.includes(t)) { idx[key] = i; break; }
    }
  });
  const rosterKeys = new Set(roster.map(s => normHeaderToken(s.full_name || s.name)));
  const valid = [], skipped = [];
  const seen = new Set();
  rows.forEach((cells, ri) => {
    const get = k => { const i = idx[k]; return i === undefined ? '' : String(cells[i] ?? '').trim(); };
    const name = get('name') || get('full_name');
    const dob = normalizeISODate(get('dob'));
    const reason = [];
    if (!name) reason.push('missing name');
    if (!dob) reason.push('missing/invalid date of birth');
    const key = normHeaderToken(get('full_name') || name);
    if (key && rosterKeys.has(key)) reason.push('already in roster');
    if (key && seen.has(key)) reason.push('duplicate in file');
    if (reason.length) { skipped.push({ row: ri + 2, name: name || '(no name)', reason: reason.join(', ') }); return; }
    seen.add(key);
    valid.push({
      name,
      full_name: get('full_name') || null,
      dob,
      belt: normalizeBelt(get('belt')) || 'White (10th Kyu)',
      grade: get('grade') || null,
      join_date: normalizeISODate(get('join_date')) || todayISO(),
      birth_cert_no: get('birth_cert_no') || null,
      nic: get('nic') || null,
      school_admission_no: get('school_admission_no') || null,
      association_admission_no: get('association_admission_no') || null,
      guardian_name: get('guardian_name') || null,
      guardian_phone: get('guardian_phone') || null,
      guardian_whatsapp: get('guardian_whatsapp') || null,
      guardian_email: get('guardian_email') || null,
      guardian_address: get('guardian_address') || null,
    });
  });
  return { valid, skipped };
}

function ImportStudentsModal({ roster, onClose, onImport }) {
  const fileRef = React.useRef(null);
  const [fileName, setFileName] = React.useState('');
  const [valid, setValid] = React.useState([]);
  const [skipped, setSkipped] = React.useState([]);
  const [busy, setBusy] = React.useState(false);
  const [error, setError] = React.useState('');
  const [done, setDone] = React.useState(null);

  async function handleFile(file) {
    if (!file) return;
    setFileName(file.name);
    setDone(null);
    setError('');
    try {
      const rows = parseCSV(await file.text());
      if (rows.length < 2) { setError('The file has no data rows — it needs a header line plus at least one student.'); setValid([]); setSkipped([]); return; }
      const res = csvToStudents(rows[0], rows.slice(1), roster);
      setValid(res.valid);
      setSkipped(res.skipped);
    } catch (e) {
      setError('Could not read the file: ' + (e && e.message ? e.message : e));
      setValid([]);
      setSkipped([]);
    }
  }

  async function doImport() {
    setBusy(true);
    setError('');
    try {
      await onImport(valid);
      setDone({ added: valid.length });
    } catch (e) {
      setError('Import failed: ' + (e && e.message ? e.message : e));
    } finally {
      setBusy(false);
    }
  }

  return (
    <Modal title="Import Students" onClose={onClose} wide>
      <input ref={fileRef} type="file" accept=".csv,text/csv" className="hidden"
        onChange={e => { handleFile(e.target.files && e.target.files[0]); e.target.value = ''; }} />

      {!done && !fileName && (
        <div className="rounded-xl border border-dashed border-[var(--ack-border)] p-5 text-center mb-4">
          <FileText size={28} className="mx-auto mb-2" color={ROYAL} />
          <p className="text-sm font-semibold mb-1" style={{ color: 'var(--ack-heading)' }}>Choose a CSV file</p>
          <p className="text-xs text-[var(--ack-muted)] mb-4">Columns can match the Export CSV button (Admission ID, Name, Full Name, DOB, Belt, Grade, Join Date, Birth Cert No, NIC, School Admission No, Association Admission No, Guardian Name, Guardian Phone, Guardian WhatsApp, Guardian Email, Guardian Address). Only Name and Date of Birth are required; Admission IDs are assigned automatically.</p>
          <button onClick={() => fileRef.current && fileRef.current.click()} className="px-4 py-2.5 rounded-xl font-semibold text-sm text-white shadow-sm active:scale-[0.98] transition" style={{ background: ROYAL }}>
            <UploadCloud size={15} className="inline mr-1.5 -mt-0.5" />Choose CSV file
          </button>
        </div>
      )}

      {!done && fileName && (
        <>
          <div className="flex items-center gap-2 rounded-xl px-3 py-2.5 mb-3" style={{ background: 'var(--ack-surface-2)' }}>
            <FileText size={15} color={ROYAL} />
            <p className="text-sm font-semibold truncate flex-1" style={{ color: 'var(--ack-heading)' }}>{fileName}</p>
            <button onClick={() => { setFileName(''); setValid([]); setSkipped([]); setError(''); }} className="text-xs font-semibold shrink-0" style={{ color: ROYAL }}>Choose another</button>
          </div>
          <div className="flex gap-2 mb-3">
            <span className="text-[11px] font-bold px-2.5 py-1 rounded-full" style={{ background: 'rgba(52,199,89,0.15)', color: '#1D7A36' }}>{valid.length} ready to import</span>
            {skipped.length > 0 && <span className="text-[11px] font-bold px-2.5 py-1 rounded-full" style={{ background: 'rgba(255,149,0,0.15)', color: '#B45309' }}>{skipped.length} skipped</span>}
          </div>
          {skipped.length > 0 && (
            <div className="max-h-44 overflow-y-auto mb-3 rounded-xl border border-[var(--ack-border)] divide-y divide-[var(--ack-border)]">
              {skipped.map((s, i) => (
                <div key={i} className="flex items-start gap-2 px-3 py-2">
                  <AlertTriangle size={13} className="mt-0.5 shrink-0" color="#B45309" />
                  <p className="text-xs leading-snug" style={{ color: 'var(--ack-text)' }}><span className="font-semibold">Row {s.row}:</span> {s.name} — {s.reason}</p>
                </div>
              ))}
            </div>
          )}
          {error && <p className="text-xs mb-3" style={{ color: DANGER }}>{error}</p>}
          <PrimaryButton onClick={doImport} disabled={busy || valid.length === 0} className="w-full">
            {busy ? 'Importing…' : `Import ${valid.length} student${valid.length === 1 ? '' : 's'}`}
          </PrimaryButton>
        </>
      )}

      {done && (
        <div className="text-center py-6">
          <span className="w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-3" style={{ background: 'rgba(52,199,89,0.15)' }}>
            <Check size={26} color="#1D7A36" />
          </span>
          <p className="font-bold text-base mb-1" style={{ color: 'var(--ack-heading)' }}>{done.added} student{done.added === 1 ? '' : 's'} added to the roster</p>
          <p className="text-xs text-[var(--ack-muted)] mb-4">Admission IDs were assigned automatically. Your list refreshes in the Students tab.</p>
          {skipped.length > 0 && <p className="text-xs mb-4" style={{ color: '#B45309' }}>{skipped.length} row{skipped.length === 1 ? '' : 's'} skipped — {skipped.map(s => s.reason).join('; ')}</p>}

        </div>
      )}
    </Modal>
  );
}

function AttendanceCalendar({ studentId, attendance }) {
  const [cursor, setCursor] = React.useState(() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; });
  const monthName = new Date(cursor.y, cursor.m, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  const firstDow = new Date(cursor.y, cursor.m, 1).getDay();
  const daysInMonth = new Date(cursor.y, cursor.m + 1, 0).getDate();
  const recsByDay = {};
  attendance.filter(a => a.student_id === studentId).forEach(a => {
    const d = new Date(a.date + 'T00:00:00');
    if (d.getFullYear() === cursor.y && d.getMonth() === cursor.m) recsByDay[d.getDate()] = a.status;
  });
  const statusColor = { present: SUCCESS, absent: DANGER, late: WARNING };
  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  function shift(delta) {
    let m = cursor.m + delta, y = cursor.y;
    if (m < 0) { m = 11; y -= 1; } if (m > 11) { m = 0; y += 1; }
    setCursor({ y, m });
  }
  return (
    <Card className="p-4">
      <div className="flex items-center justify-between mb-3">
        <button onClick={() => shift(-1)}><ChevronLeft size={16} color="var(--ack-heading)" /></button>
        <p className="font-bold text-sm" style={{ color: 'var(--ack-heading)' }}>{monthName}</p>
        <button onClick={() => shift(1)}><ChevronRight size={16} color="var(--ack-heading)" /></button>
      </div>
      <div className="grid grid-cols-7 gap-1 mb-1">
        {['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((d, i) => <p key={i} className="text-center text-[10px] text-[var(--ack-muted)] font-semibold">{d}</p>)}
      </div>
      <div className="grid grid-cols-7 gap-1">
        {cells.map((d, i) => {
          const status = d ? recsByDay[d] : null;
          return (
            <div key={i} className="aspect-square flex items-center justify-center rounded-lg text-[11px] font-semibold"
              style={d ? { background: status ? statusColor[status] : 'var(--ack-surface-2)', color: status ? '#fff' : '#9CA3AF' } : {}}>{d || ''}</div>
          );
        })}
      </div>
      <div className="flex gap-4 mt-3 text-[11px] text-[var(--ack-muted)]">
        <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full" style={{ background: SUCCESS }} />Present</span>
        <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full" style={{ background: DANGER }} />Absent</span>
        <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full" style={{ background: WARNING }} />Late</span>
      </div>
    </Card>
  );
}

function AttendanceTrend({ attendance, sessions, students, goToAnalytics }) {
  const [granularity, setGranularity] = React.useState('weekly');
  const series = React.useMemo(() => clubTrendSeries(attendance, granularity), [attendance, granularity]);
  const insights = React.useMemo(() => clubTrendInsights(attendance, sessions, students, series), [attendance, sessions, students, series]);

  const withData = series.filter(p => p.total > 0);
  const totalRecords = series.reduce((s, p) => s + p.total, 0);
  const avgRate = totalRecords
    ? Math.round((series.reduce((s, p) => s + p.rate * p.total, 0) / totalRecords) * 10) / 10
    : 0;

  // Same "later half vs earlier half" delta the insights use, surfaced as a chip.
  let delta = null;
  if (withData.length >= 2) {
    const half = Math.ceil(withData.length / 2);
    const earlier = withData.slice(0, half).reduce((s, p) => s + p.rate, 0) / half;
    const later = withData.slice(half).reduce((s, p) => s + p.rate, 0) / (withData.length - half);
    delta = Math.round((later - earlier) * 10) / 10;
  }
  const best = withData.length ? withData.reduce((a, b) => (b.rate > a.rate ? b : a)) : null;
  const worst = withData.length ? withData.reduce((a, b) => (b.rate < a.rate ? b : a)) : null;

  const statCellCls = 'rounded-xl p-3 min-w-0';
  const statLabelCls = 'text-[10px] text-[var(--ack-muted)] mt-0.5';

  return (
    <Card className="p-4 mb-4">
      <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
        <p className="font-bold text-sm" style={{ color: 'var(--ack-heading)' }}>Attendance Trends</p>
        <div className="flex items-center gap-2">
          <div className="flex gap-1 p-0.5 rounded-lg" style={{ background: 'var(--ack-surface-2)' }}>
            {['weekly', 'monthly', 'yearly'].map(g => (
              <button key={g} onClick={() => setGranularity(g)} className="px-2.5 py-1 rounded-md text-[11px] font-semibold capitalize transition"
                style={granularity === g ? { background: ROYAL, color: '#fff' } : { color: '#6B7280' }}>{g}</button>
            ))}
          </div>
          {goToAnalytics && (
            <button onClick={goToAnalytics} className="text-xs font-semibold flex items-center gap-1 shrink-0" style={{ color: ROYAL }}>
              Full analytics <ArrowRight size={13} />
            </button>
          )}
        </div>
      </div>

      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-4">
        <div className={statCellCls} style={{ background: 'var(--ack-surface-2)' }}>
          <p className="text-lg font-extrabold" style={{ color: 'var(--ack-heading)', fontFamily: 'Poppins, sans-serif' }}>{avgRate}%</p>
          <p className={statLabelCls}>Average rate</p>
        </div>
        <div className={statCellCls} style={{ background: 'var(--ack-surface-2)' }}>
          <div className="flex items-center gap-1">
            {delta !== null && delta > 0.4 && <TrendingUp size={15} color={SUCCESS} />}
            {delta !== null && delta < -0.4 && <TrendingDown size={15} color={DANGER} />}
            {delta !== null && delta >= -0.4 && delta <= 0.4 && <Activity size={15} color="#6B7280" />}
            <p className="text-lg font-extrabold" style={{ color: delta !== null && delta > 0.4 ? SUCCESS : delta !== null && delta < -0.4 ? DANGER : 'var(--ack-heading)', fontFamily: 'Poppins, sans-serif' }}>
              {delta === null ? '—' : (delta > 0 ? `+${delta}` : delta)}
            </p>
          </div>
          <p className={statLabelCls}>Trend vs earlier</p>
        </div>
        <div className={statCellCls} style={{ background: 'var(--ack-surface-2)' }}>
          <p className="text-sm font-extrabold truncate" style={{ color: SUCCESS }}>{best ? best.label : '—'}</p>
          <p className={statLabelCls}>{best ? `Best period · ${best.rate}%` : 'Best period'}</p>
        </div>
        <div className={statCellCls} style={{ background: 'var(--ack-surface-2)' }}>
          <p className="text-sm font-extrabold truncate" style={{ color: DANGER }}>{worst ? worst.label : '—'}</p>
          <p className={statLabelCls}>{worst ? `Weakest period · ${worst.rate}%` : 'Weakest period'}</p>
        </div>
      </div>

      <TrendCompositionChart data={series} />

      <div className="flex flex-wrap items-center gap-x-4 gap-y-1 mt-3 text-[11px] text-[var(--ack-muted)]">
        <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-sm" style={{ background: SUCCESS }} />Present</span>
        <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-sm" style={{ background: WARNING }} />Late</span>
        <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-sm" style={{ background: DANGER }} />Absent</span>
        <span className="flex items-center gap-1.5"><span className="w-3 h-1.5 rounded-full" style={{ background: ROYAL }} />Rate (late = ½)</span>
        <span className="ml-auto font-semibold" style={{ color: 'var(--ack-heading)' }}>{totalRecords} marks</span>
      </div>

      {insights.length > 0 && (
        <div className="mt-3 pt-3 border-t border-[var(--ack-border)] space-y-2">
          {insights.map((ins, i) => (
            <div key={i} className="flex items-start gap-2">
              <span className="w-6 h-6 rounded-lg flex items-center justify-center shrink-0" style={{ background: `${ins.tint}1A` }}><ins.icon size={12} color={ins.tint} /></span>
              <p className="text-xs leading-snug" style={{ color: 'var(--ack-text)' }}>{ins.text}</p>
            </div>
          ))}
        </div>
      )}
    </Card>
  );
}
