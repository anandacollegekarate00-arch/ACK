# Netlify (free tier) — builds the Vite app and serves dist/.
[build]
  command = "npm ci && npm run build"
  publish = "dist"

# SPA + PWA: the service worker handles offline navigation; anything else
# falls back to index.html so deep links (e.g. /tournament/123) work.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache the hashed assets aggressively; never cache index.html/sw.js.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"